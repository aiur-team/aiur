<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../dist/init/theme-init.js" data-default="dark"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aiur-style Gallery</title>
  <link rel="stylesheet" href="../dist/aiur-style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--aiur-color-bg);
      color: var(--aiur-color-fg);
      font: 16px system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      padding: 2rem;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--aiur-color-fg);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
    }

    .theme-toggle {
      cursor: pointer;
      padding: 0.5rem 1rem;
      border: 1px solid var(--aiur-color-fg);
      border-radius: 4px;
      background: transparent;
      color: var(--aiur-color-fg);
      font: inherit;
    }

    .theme-toggle:hover {
      background-color: var(--aiur-color-fg);
      color: var(--aiur-color-bg);
    }

    .gallery-sections {
      display: grid;
      gap: 3rem;
    }

    .section {
      padding: 2rem;
      border: 1px solid var(--aiur-color-fg);
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.02);
    }

    .section h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .section p {
      color: var(--aiur-color-muted);
      font-size: 0.9rem;
    }
    .swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .swatch { min-width: 0; border: 1px solid var(--aiur-color-line-strong); border-radius: 7px; overflow: hidden; }
    .swatch-color { height: 48px; border-bottom: 1px solid var(--aiur-color-line); }
    .swatch-info { padding: 12px; }
    .swatch code { display: block; overflow-wrap: anywhere; font-size: 12px; }
    .swatch-value { color: var(--aiur-color-muted); margin: 4px 0 8px; }
    .swatch-sample { padding: 8px; border-radius: 4px; }
    .swatch-note { margin-top: 8px; font-size: 12px; }
    @media (max-width: 480px) { body { padding: 16px; } .section { padding: 16px; } .gallery-header { gap: 16px; } }
  </style>
</head>
<body>
  <div class="gallery-header">
    <h1>aiur-style Gallery</h1>
    <button class="theme-toggle" id="theme-toggle">
      Switch Theme
    </button>
  </div>

  <div class="gallery-sections">
    <section class="section" id="tokens">
      <h2>Color tokens</h2>
      <p>Switch themes to inspect the fixed palette. Text samples use readable-text tokens where required.</p>
      <div class="swatches" id="swatches"></div>
    </section>
    <div class="section">
      <h2>Components Coming Soon</h2>
      <p>This gallery scaffolding will be populated with component examples as they are added to the package.</p>
    </div>
  </div>

  <script type="module" src="./gallery.js"></script>
</body>
</html>
