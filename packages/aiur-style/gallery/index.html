<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../dist/init/theme-init.js" data-default="dark"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aiur-style Gallery</title>
  <link rel="stylesheet" href="../dist/aiur-style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--aiur-color-bg);
      color: var(--aiur-color-fg);
      font: 16px system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      padding: 2rem;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--aiur-color-fg);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
    }

    .theme-toggle {
      cursor: pointer;
      padding: 0.5rem 1rem;
      border: 1px solid var(--aiur-color-fg);
      border-radius: 4px;
      background: transparent;
      color: var(--aiur-color-fg);
      font: inherit;
    }

    .theme-toggle:hover {
      background-color: var(--aiur-color-fg);
      color: var(--aiur-color-bg);
    }

    .gallery-sections {
      display: grid;
      gap: 3rem;
    }

    .section {
      padding: 2rem;
      border: 1px solid var(--aiur-color-fg);
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.02);
    }

    .section h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .section p {
      color: var(--aiur-color-muted);
      font-size: 0.9rem;
    }
    .swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .swatch { min-width: 0; border: 1px solid var(--aiur-color-line-strong); border-radius: 7px; overflow: hidden; }
    .swatch-color { height: 48px; border-bottom: 1px solid var(--aiur-color-line); }
    .swatch-info { padding: 12px; }
    .swatch code { display: block; overflow-wrap: anywhere; font-size: 12px; }
    .swatch-value { color: var(--aiur-color-muted); margin: 4px 0 8px; }
    .swatch-sample { padding: 8px; border-radius: 4px; }
    .swatch-note { margin-top: 8px; font-size: 12px; }
    @media (max-width: 480px) { body { padding: 16px; } .section { padding: 16px; } .gallery-header { gap: 16px; } }
  </style>
</head>
<body>
  <div class="gallery-header">
    <h1>aiur-style Gallery</h1>
    <button class="theme-toggle" id="theme-toggle">
      Switch Theme
    </button>
  </div>

  <div class="gallery-sections">
    <section class="section" id="tokens">
      <h2>Color tokens</h2>
      <p>Switch themes to inspect the fixed palette. Text samples use readable-text tokens where required.</p>
      <div class="swatches" id="swatches"></div>
    </section>
    <div class="section">
      <h2>Components Coming Soon</h2>
      <p>This gallery scaffolding will be populated with component examples as they are added to the package.</p>
    </div>
  </div>

  <script type="module">
    import { tokens, contrastPairs } from '../dist/tokens.js';
    const cssName = name => `--aiur-${name.replaceAll('.', '-')}`;
    function renderSwatches() {
      const theme = document.documentElement.dataset.theme ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.getElementById('swatches').replaceChildren(...Object.entries(tokens[theme])
        .filter(([name]) => name.startsWith('color.')).map(([name, value]) => {
          const card = document.createElement('article');
          card.className = 'swatch';
          card.dataset.token = name;
          const color = document.createElement('div');
          color.className = 'swatch-color';
          color.style.background = `var(${cssName(name)})`;
          const info = document.createElement('div');
          info.className = 'swatch-info';
          const label = document.createElement('code');
          label.textContent = cssName(name);
          const resolved = document.createElement('code');
          resolved.className = 'swatch-value';
          resolved.textContent = value;
          const sample = document.createElement('div');
          sample.className = 'swatch-sample';
          sample.textContent = 'Readable sample text';
          const pair = contrastPairs.find(pair => pair.foreground === name);
          sample.style.color = `var(${cssName(pair?.foreground ?? 'color.fg')})`;
          sample.style.background = `var(${cssName(pair?.background ?? 'color.bg')})`;
          info.append(label, resolved, sample);
          if (name.includes('-on-')) {
            const note = document.createElement('p');
            note.className = 'swatch-note';
            note.textContent = `Text on ${pair?.background ?? 'a fill'}; preserves the fixed palette.`;
            info.append(note);
          }
          card.append(color, info);
          return card;
        }));
    }
    // Parse theme from URL query parameter
    const params = new URLSearchParams(window.location.search);
    const urlTheme = params.get('theme');
    if (urlTheme === 'light' || urlTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', urlTheme);
    }

    if (urlTheme === 'system') document.documentElement.removeAttribute('data-theme');
    renderSwatches();
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderSwatches);

    // Theme toggle button
    const toggleBtn = document.getElementById('theme-toggle');
    const html = document.documentElement;

    toggleBtn.addEventListener('click', () => {
      const currentTheme = html.getAttribute('data-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      renderSwatches();

      // Update URL
      const newUrl = new URL(window.location);
      newUrl.searchParams.set('theme', newTheme);
      window.history.replaceState({}, '', newUrl);
    });
  </script>
</body>
</html>
