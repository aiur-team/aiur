<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../dist/init/theme-init.js" data-default="dark"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aiur-style top bar demo</title>
  <link rel="stylesheet" href="../dist/aiur-style.css">
  <link rel="stylesheet" href="../dist/fonts.css">
  <style>
    body { margin: 0; background: var(--aiur-color-bg); color: var(--aiur-color-fg); }
    .hero { height: 700px; display: grid; place-items: center; }
    .rest { height: 1600px; padding: 40px; }
    .aiur-topbar { margin-bottom: -82px; } /* float over the hero, as on aiur.team */
  </style>
</head>
<body>
  <header class="aiur-topbar aiur-topbar--sticky" data-aiur="topbar" data-aiur-reveal-after=".hero">
    <a class="aiur-brand" href="#top" aria-label="Aiur home"><img class="aiur-brand__logo" src="../dist/assets/aiur-logo-512.png" alt=""><span class="aiur-brand__word">aiur</span></a>
    <nav class="aiur-topbar__actions" aria-label="Primary">
      <a class="aiur-topbar__link" href="#docs">Docs</a>
      <button type="button" class="aiur-theme-toggle aiur-button aiur-button--icon aiur-button--sm" data-aiur="theme-toggle" aria-label="Dark mode" aria-pressed="false">
        <svg class="aiur-theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="aiur-theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
      </button>
    </nav>
  </header>
  <main id="top">
    <section class="hero"><h1>Hero</h1></section>
    <section class="rest" id="docs"><p>Scroll content</p></section>
  </main>
  <script type="module" src="../dist/js/auto.js"></script>
</body>
</html>
