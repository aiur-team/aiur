<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Command box — aiur-style</title>
  <script src="../dist/init/theme-init.js" data-default="dark"></script>
  <link rel="stylesheet" href="../dist/fonts.css">
  <link rel="stylesheet" href="../dist/aiur-style.css">
  <style>body { margin: 24px; background: var(--aiur-color-bg); color: var(--aiur-color-fg); } main { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: start; gap: 24px; min-width: 0; } h1 { font: 24px var(--aiur-font-body); }</style>
</head>
<body><main id="commands"><h1>Command and prompt boxes</h1>
<div class="aiur-command aiur-keepout" data-aiur="command" id="command-tabs">
  <div class="aiur-tabs" role="tablist" aria-label="Get started">
    <button type="button" role="tab" id="t-prompt" aria-selected="true" aria-controls="cmd-panel" tabindex="0" data-aiur-text="Let's run parallel agents with: https://aiur.team/" data-aiur-kind="prompt">Prompt</button>
    <button type="button" role="tab" id="t-npm" aria-selected="false" aria-controls="cmd-panel" tabindex="-1" data-aiur-text="npm i -g aiur-cli">npm</button>
    <button type="button" role="tab" id="t-bun" aria-selected="false" aria-controls="cmd-panel" tabindex="-1" data-aiur-text="bun add -g aiur-cli">bun</button>
    <button type="button" role="tab" id="t-pnpm" aria-selected="false" aria-controls="cmd-panel" tabindex="-1" data-aiur-text="pnpm add -g aiur-cli">pnpm</button>
    <button type="button" role="tab" id="t-yarn" aria-selected="false" aria-controls="cmd-panel" tabindex="-1" data-aiur-text="yarn global add aiur-cli">yarn</button>
  </div>
  <div class="aiur-command__row" id="cmd-panel" role="tabpanel" aria-labelledby="t-prompt" tabindex="0">
    <span class="aiur-command__prompt" aria-hidden="true" hidden>$</span>
    <code class="aiur-command__text">Let's run parallel agents with: https://aiur.team/</code>
    <button type="button" class="aiur-command__copy aiur-button aiur-button--ghost aiur-button--icon" aria-label="Copy prompt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg></button>
    <span class="aiur-visually-hidden" role="status" aria-live="polite"></span>
  </div>
</div>
<div class="aiur-command" data-aiur="command" id="command-single" data-aiur-prompt=">">
  <div class="aiur-command__row">
    <span class="aiur-command__prompt" aria-hidden="true">$</span>
    <code class="aiur-command__text">npm i -g aiur-cli</code>
    <button type="button" class="aiur-command__copy aiur-button aiur-button--ghost aiur-button--icon" aria-label="Copy command"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg></button>
    <span class="aiur-visually-hidden" role="status" aria-live="polite"></span>
  </div>
</div>
<div class="aiur-command aiur-command--soon" data-aiur="command" id="command-soon" aria-disabled="true">
  <div class="aiur-command__row">
    <span class="aiur-command__prompt" aria-hidden="true">$</span>
    <code class="aiur-command__text">npm i -g aiur-cli</code>
    <button type="button" disabled class="aiur-command__copy aiur-button aiur-button--ghost aiur-button--icon" aria-label="Copy command"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg></button>
    <span class="aiur-visually-hidden" role="status" aria-live="polite"></span>
  </div>
  <span class="aiur-command__soon">Coming soon</span>
</div>
</main><script type="module" src="../dist/js/auto.js"></script><script type="module" src="./command.js"></script></body>
</html>
