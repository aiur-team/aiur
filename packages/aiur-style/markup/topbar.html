<!-- Load js/auto.js. data-aiur-reveal-after tucks the brand while that element is visible; drop it to always show the brand. -->
<header class="aiur-topbar aiur-topbar--sticky" data-aiur="topbar" data-aiur-reveal-after=".hero">
  <a class="aiur-brand" href="/" aria-label="Aiur home"><img class="aiur-brand__logo" src="/aiur-style/assets/aiur-logo-512.png" alt=""><span class="aiur-brand__word">aiur</span></a>
  <nav class="aiur-topbar__actions" aria-label="Primary">
    <a class="aiur-topbar__link" href="/docs/">Docs</a>
    <!-- theme toggle: see theme-toggle.html -->
  </nav>
</header>
<!-- --end variant (no brand, right-aligned): <header class="aiur-topbar aiur-topbar--end" data-aiur="topbar"> with only the actions nav. -->
