<a class="aiur-button aiur-button--lg" href="/docs/">
  Example Doc
  <svg class="aiur-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">

<button type="button" class="aiur-button aiur-button--sm">Continue</button>

<button type="button" class="aiur-button" disabled>Unavailable</button>
