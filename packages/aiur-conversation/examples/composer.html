<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>aiur-composer example</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; font-family: system-ui, sans-serif; background: #f4f5f7; }
  .dark { --aiur-composer-bg: #1d2026; --aiur-composer-fg: #eef0f3; --aiur-composer-muted: #9aa3ad; --aiur-composer-line: #343943; --aiur-composer-button-bg: #2a2e36; --aiur-composer-accent: #ff7a3d; background: #111317; }
  .ogm {
    background: #f6f0e4;
    --aiur-composer-bg: #fffaf0;
    --aiur-composer-fg: #242019;
    --aiur-composer-line: #a89c85;
    --aiur-composer-button-bg: #ede3d1;
    --aiur-composer-radius: 6px;
    --aiur-composer-control-radius: 4px;
    --aiur-composer-gap: 12px;
    --aiur-composer-padding: 12px;
    --aiur-composer-font: Georgia, serif;
    --aiur-composer-shadow: none;
  }
  .ogm aiur-composer::part(input) { border-bottom: 2px solid #596743; }
  .ogm [slot="send"] { background: #405332; color: #fffaf0; font: inherit; border: 0; border-radius: 4px; min-height: 44px; padding-inline: 16px; }
  .ogm [slot="send"]:disabled { opacity: 0.5; }
  #log { padding: 16px 16px 160px; margin: 0; list-style: none; display: grid; gap: 8px; }
</style>
</head>
<body>
<ul id="log"></ul>
<aiur-composer pinned placeholder="Message" accept="image/*,audio/*,video/*"></aiur-composer>
<template id="ogm-controls">
  <button type="button" slot="send" disabled>Send message</button>
</template>
<script type="module">
  import { defineComposer } from '../src/index.mjs';

  defineComposer();
  const composer = document.querySelector('aiur-composer');
  const params = new URLSearchParams(location.search);
  if (params.has('dark')) document.body.classList.add('dark');
  if (params.get('skin') === 'ogm') {
    document.body.classList.add('ogm');
    composer.append(document.querySelector('#ogm-controls').content.cloneNode(true));
    const send = composer.querySelector('[slot="send"]');
    send.addEventListener('click', () => composer.send());
    const syncSend = ({ controls }) => {
      send.disabled = controls.send.disabled;
      send.setAttribute('aria-label', controls.send.label);
    };
    composer.addEventListener('aiur-conversation-state', ({ detail }) => syncSend(detail));
    syncSend(composer.state);
  }
  const log = document.querySelector('#log');
  let voiceCallbacks;
  let voiceTimer;
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  // Stand-ins for the host's own transport.
  composer.adapters = {
    upload: async (file) => (await wait(300), { name: file.name, id: crypto.randomUUID() }),
    dictation: {
      async start({ onPartial, onLevel }) {
        const words = 'make the hero jump twice as high'.split(' ');
        let heard = 0;
        const timer = setInterval(() => {
          onLevel(Math.random());
          if (Math.random() < 0.25 && heard < words.length) onPartial(words.slice(0, ++heard).join(' '));
        }, 80);
        return {
          stop: async () => (clearInterval(timer), words.slice(0, heard).join(' ')),
          cancel: () => clearInterval(timer),
        };
      },
    },
    voice: {
      async start({ initialText, onPartial, onLevel }) {
        voiceCallbacks = { onPartial, onLevel };
        clearInterval(voiceTimer);
        voiceTimer = setInterval(() => {
          onLevel(Math.random());
          onPartial('user', 'Hello from the microphone');
          onPartial('agent', 'Hello from the agent');
        }, 500);
        if (initialText) log.append(Object.assign(document.createElement('li'), { textContent: `(voice) ${initialText}` }));
        let muted = false;
        return { stop: async () => { clearInterval(voiceTimer); voiceCallbacks = null; }, setMuted: (value) => { muted = value; } };
      },
    },
  };
  composer.onSend = async (text, attachments) => {
    const item = document.createElement('li');
    item.textContent = [text, ...attachments.map((a) => `[${a.name}]`)].filter(Boolean).join(' ');
    log.append(item);
  };
</script>
</body>
</html>
