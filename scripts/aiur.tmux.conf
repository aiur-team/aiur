# Aiur's isolated tmux configuration.
#
# Loaded by `scripts/aiur` via `tmux -L aiur-$USER -f <path>` so it
# runs on its own socket and never touches the user's normal tmux server
# or `~/.tmux.conf`.
#
# To customize without touching this tracked file, copy it to
# `~/.config/aiur/tmux.conf` and edit there — that path takes
# precedence and survives `git pull`.

# No prefix — every Aiur binding is direct (`-n`).
set -g prefix None
unbind-key -aT prefix

set -sg escape-time 0
set -g mouse on
set -g status off
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g remain-on-exit off
set -g destroy-unattached off

# Pane navigation (cycle right / cycle left).
bind-key -n Tab    select-pane -t :.+
bind-key -n BTab   select-pane -t :.-

# Close: pane 0 (the agent list, by convention) tears down the whole
# session; any other pane just closes that pane. `if-shell -F` is the
# synchronous format-string form so the condition is evaluated against
# tmux's format engine (the shell-mode `if-shell` has been buggy since
# tmux 2.4 — tmux/tmux#882).
bind-key -n C-c if-shell -F '#{==:#{pane_index},0}' \
                 'kill-session' 'kill-pane'

# Pane layout is owned exclusively by `Aiur.PaneManager`, which applies an
# explicit `select-layout <string>` after every slot change. No
# `after-split-window` hook lives here — historically a hook ran
# `select-layout even-horizontal` to "rebalance widths", but it ran on every
# split (including PaneManager's anchored slot splits) and forced every pane
# into a single equal-width row, defeating the slot grid. See issue #34.

# Wheel routing:
#   1. If the foreground app set mouse mode (opencode-attach / any Bubble Tea
#      TUI does), forward wheel events with `send-keys -M` so the app handles
#      scroll inside its own viewport.
#   2. Else if tmux is already in copy mode (`pane_in_mode`), forward.
#   3. Else (plain shell pane, mobile SSH client doing touch-scroll) enter
#      copy mode so the user can scroll the pane's scrollback buffer.
#
# Without (1), wheel up on an opencode chat pane would force tmux into copy
# mode against opencode's full-screen TUI, which has no tmux-side scrollback
# — the indicator just sticks at `[0/0]` and chat history can't be reached.
bind-key -n WheelUpPane if-shell -F -t = '#{?mouse_any_flag,1,0}' \
                         'send-keys -M' \
                         "if-shell -F -t = '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e -t ='"
bind-key -n WheelDownPane send-keys -M
