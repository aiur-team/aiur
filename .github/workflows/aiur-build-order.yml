name: aiur-build-order

on:
  push:
    branches: [main]
    paths:
      - 'packages/aiur-build-order/**'
      - 'packages/aiur-contracts/fixtures/build-order*.json'
      - 'packages/aiur-contracts/schemas/build-order*.json'
      - 'src/priv/static/aiur-build-order/**'
      - 'scripts/sync-aiur-build-order'
      - '.github/workflows/aiur-build-order.yml'
  pull_request:
    paths:
      - 'packages/aiur-build-order/**'
      - 'packages/aiur-contracts/fixtures/build-order*.json'
      - 'packages/aiur-contracts/schemas/build-order*.json'
      - 'src/priv/static/aiur-build-order/**'
      - 'scripts/sync-aiur-build-order'
      - '.github/workflows/aiur-build-order.yml'
  # A merge group takes no paths filter; the package job is cheap and must run
  # on the merged result the queue actually tests.
  merge_group:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/aiur-build-order
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.x'
      # No runtime dependencies and no lockfile to install from: the only npm
      # dependency is @playwright/test, used by the browser job.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Pack the tarball and render it in an isolated consumer
        run: npm run pack:check
      - name: Check the committed dashboard copy matches dist
        working-directory: .
        run: |
          # diff -r reports changed files and files missing from either side.
          mkdir -p "$RUNNER_TEMP/aiur-build-order-sync"
          scripts/sync-aiur-build-order "$RUNNER_TEMP/aiur-build-order-sync"
          diff -r "$RUNNER_TEMP/aiur-build-order-sync/aiur-build-order" src/priv/static/aiur-build-order || { echo "committed copy differs from dist; run scripts/sync-aiur-build-order"; exit 1; }

  browser:
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    defaults:
      run:
        working-directory: packages/aiur-build-order
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.x'
      - run: npm install --no-audit --no-fund
      - name: Render the fixture page in Chromium
        run: npx playwright test
