name: home parity nightly
on:
  schedule:
    - cron: '41 5 * * *'
permissions:
  contents: read
concurrency:
  group: home-parity-nightly
  cancel-in-progress: false
jobs:
  matrix:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/home-parity.yml
  report-nightly-failure:
    needs: matrix
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.matrix.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout tested main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: File or update nightly failure ticket
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/report-home-parity-nightly.mjs
