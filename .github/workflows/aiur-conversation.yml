name: aiur-conversation

on:
  push:
    branches: [main]
    paths:
      - 'packages/aiur-conversation/**'
      - '.github/workflows/aiur-conversation.yml'
  pull_request:
    paths:
      - 'packages/aiur-conversation/**'
      - '.github/workflows/aiur-conversation.yml'

permissions:
  contents: read

jobs:
  package-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/aiur-conversation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.x'
      - run: npm ci --ignore-scripts
      - run: npm test
