name: voice-converse-standalone

on:
  push:
    branches: [main]
    paths:
      - 'packages/elixir/voice_converse/**'
      - 'packages/aiur-contracts/**'
      - 'scripts/check-voice-converse-isolation.sh'
      - '.github/workflows/voice-converse-standalone.yml'
  pull_request:
    paths:
      - 'packages/elixir/voice_converse/**'
      - 'packages/aiur-contracts/**'
      - 'scripts/check-voice-converse-isolation.sh'
      - '.github/workflows/voice-converse-standalone.yml'

permissions:
  contents: read

jobs:
  voice-converse-standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: "2026.8.8"
          install: true
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: packages/aiur-contracts/package-lock.json
      - name: Install contract validator
        working-directory: packages/aiur-contracts
        run: npm ci
      - name: No aiur reference
        run: scripts/check-voice-converse-isolation.sh
      - name: Compile and test the package alone
        working-directory: packages/elixir/voice_converse
        run: |
          mise exec -- mix deps.get
          mise exec -- mix compile --warnings-as-errors
          mise exec -- mix format --check-formatted
          mise exec -- mix test
