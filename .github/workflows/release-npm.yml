name: release-npm

# Builds a native, self-contained OTP release per OS/arch and uploads each as a
# packed npm tarball, then publishes all of them to npm in lockstep.
#
# Publishing uses npm OIDC trusted publishing, not an npm token. npm matches the
# trusted publisher on this workflow's filename, so every channel — stable,
# nightly, dry run — is triggered on THIS file. A separate publishing workflow,
# or a reusable-workflow indirection, presents a different `workflow_ref` claim
# and is rejected (npm/documentation#1755).
#
# Channels:
#   stable   push of a v* tag, or workflow_dispatch with channel=stable.
#            Version comes from src/mix.exs; a tag must agree with it.
#            Publishes under `latest`.
#   nightly  the nightly schedule, or workflow_dispatch with channel=nightly.
#            Version is <mix.exs>-nightly.<short-sha>, published under the
#            `nightly` dist-tag. Never touches `latest` or `next`.
#   dry-run  default for workflow_dispatch. Builds, smokes, and runs
#            `npm publish --dry-run`. Nothing reaches the registry.
on:
  push:
    tags:
      - "v*"
  schedule:
    # Nightly cut. GitHub cron is UTC and has no DST handling: 07:00 UTC is
    # 00:00 America/Los_Angeles while PDT is in effect, and 23:00 the previous
    # day under PST. The "did main move" gate below keys off the head commit,
    # not the calendar, so that one-hour drift can neither skip nor double-cut.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options:
          - dry-run
          - nightly
          - stable
        default: dry-run

permissions:
  contents: read

jobs:
  # Resolve one version for the whole run and decide whether it should proceed.
  # Every downstream job reads these outputs; nothing recomputes a version.
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The nightly gate diffs HEAD against the last published nightly's
          # commit, which needs that commit in the local history.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      # src/mix.exs is the single source of truth for the Aiur version. The
      # checked-in npm package.json files must already agree with it, so a local
      # `npm pack` and a published tarball can never disagree.
      - name: Verify checked-in package versions match mix.exs
        run: |
          base=$(node packaging/scripts/resolve-version.mjs --channel stable --format plain)
          pkg=$(node -p "require('./packaging/npm/aiur-cli/package.json').version")
          echo "mix.exs=$base packaging/npm/aiur-cli=$pkg"
          if [ "$base" != "$pkg" ]; then
            echo "version drift: run \`node packaging/scripts/stamp-versions.mjs $base\` and commit" >&2
            exit 1
          fi

      # mix.exs must always name an UNRELEASED version. A nightly is a
      # prerelease of it, and a prerelease sorts below its base, so a base that
      # is already on the registry would produce a nightly older than something
      # published. That is the mistake that leaves the repo one bump behind.
      - name: Verify the version is unreleased
        run: |
          base=$(node packaging/scripts/resolve-version.mjs --channel stable --format plain)
          if [ -n "$(npm view "aiur-cli@$base" version 2>/dev/null || true)" ]; then
            echo "aiur-cli@$base is already published; bump src/mix.exs before releasing" >&2
            exit 1
          fi

      # The platform set this release publishes must equal the set aiur-cli pins
      # as optionalDependencies, and both must match platforms.mjs. A pin with no
      # published package is the silent-broken-install defect from #2110 — CI
      # enforces it on every PR, and a release run re-checks before publishing.
      - name: Check platform publish/pin drift
        run: node packaging/scripts/check-platform-drift.mjs

      - name: Resolve channel and version
        id: resolve
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: bash packaging/scripts/release-npm/resolve-channel.sh

      # A nightly is worth cutting only if the packages changed; see the script.
      - name: Gate nightly on package changes
        id: gate
        env:
          CHANNEL: ${{ steps.resolve.outputs.channel }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: bash packaging/scripts/release-npm/gate-nightly.sh

      - name: Summary
        env:
          CHANNEL: ${{ steps.resolve.outputs.channel }}
          VERSION: ${{ steps.resolve.outputs.version }}
          DIST_TAG: ${{ steps.resolve.outputs.dist_tag || 'none' }}
          PUBLISH: ${{ steps.resolve.outputs.publish }}
          PROCEED: ${{ steps.gate.outputs.proceed }}
        run: |
          {
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| channel | $CHANNEL |"
            echo "| version | $VERSION |"
            echo "| dist-tag | $DIST_TAG |"
            echo "| publishes | $PUBLISH |"
            echo "| proceeding | $PROCEED |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.target }}
    needs: setup
    if: needs.setup.outputs.proceed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-14
            target: darwin-arm64
          # darwin-x64 (Intel Mac) temporarily disabled: macos-13 hosted runners
          # are unavailable and queue indefinitely. Re-enable when an Intel runner
          # (hosted or self-hosted) is available.
          # - runner: macos-13
          #   target: darwin-x64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Single installer for Erlang/Elixir across all four images, matching the
      # versions the rest of CI uses (mise.toml). setup-beam does not
      # provide prebuilt OTP on macOS, so mise is the cross-platform choice.
      - name: Set up mise tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          # Pin mise itself; bump only in a CI-validated commit.
          version: "2026.8.8"
          install: true
          cache: true

      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/deps
          key: ${{ runner.os }}-${{ matrix.target }}-mix-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-mix-

      - name: Build release
        id: build
        env:
          MIX_ENV: prod
        run: |
          release_dir=$(bash packaging/scripts/build-release.sh)
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Assemble platform package
        id: assemble
        run: |
          out=$(node packaging/scripts/assemble-platform-package.mjs \
            --release "${{ steps.build.outputs.release_dir }}" \
            --target "${{ matrix.target }}" \
            --version "${{ needs.setup.outputs.version }}")
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Verify local layout assets in release packages
        run: |
          node packaging/scripts/check-layout-assets-release.mjs --release "${{ steps.build.outputs.release_dir }}"
          node packaging/scripts/check-layout-assets-release.mjs --release "${{ steps.assemble.outputs.out }}/release"

      - name: Pack tarball
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "${{ steps.assemble.outputs.out }}"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aiur-cli-${{ matrix.target }}
          path: dist/*.tgz
          if-no-files-found: error

  # Prove a real global install yields a working interactive aiur on each target
  # — not just --version. Runs on tags and on workflow_dispatch dry runs.
  smoke:
    name: smoke ${{ matrix.target }}
    needs: [setup, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-14
            target: darwin-arm64
          # darwin-x64 (Intel Mac) temporarily disabled: macos-13 hosted runners
          # are unavailable and queue indefinitely. Re-enable when an Intel runner
          # (hosted or self-hosted) is available.
          # - runner: macos-13
          #   target: darwin-x64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install tmux
          else
            sudo apt-get update && sudo apt-get install -y tmux
          fi
          tmux -V

      - name: Download matching platform artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aiur-cli-${{ matrix.target }}
          path: artifacts

      - name: Stamp and pack launcher
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: bash packaging/scripts/release-npm/stamp-and-pack-launcher.sh launcher

      # --offline proves aiur's OWN packages install with no registry round-trip
      # (the platform tarballs are local; optional deps for the other targets are
      # skipped, leaving a single-platform footprint). The postinstall still
      # provisions the pinned opencode ONLINE — installOpencode forces
      # --no-offline so it never inherits this --offline context — which the
      # "Peer deps provisioned" step below asserts.
      - name: Global install from local tarballs (offline)
        run: |
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          npm install -g --offline "$GITHUB_WORKSPACE"/launcher/*.tgz "$GITHUB_WORKSPACE"/artifacts/*.tgz

      - name: Version pre-check
        run: aiur --version

      - name: Installed tmux pane controls
        run: |
          launcher="$(npm root -g)/aiur-cli"
          test -x "$launcher/libexec/aiur-pane-ctrlc"
          AIUR_TMUX_CONF_TEST="$launcher/share/aiur.tmux.conf" bash scripts/verify-ctrlc-binding.sh

      # Regression guard for the offline-inheritance bug: a plain install must
      # leave the interactive peer deps ready so `aiur init` works with nothing
      # else to install. tmux is installed above; opencode is provisioned by the
      # postinstall even though the outer install ran --offline.
      - name: Peer deps provisioned (pinned opencode + tmux)
        run: |
          pin=$(node -p "require('$GITHUB_WORKSPACE/packaging/npm/aiur-cli/package.json').opencodeVersion")
          got=$(opencode --version)
          echo "opencode: want $pin, got $got"
          test "$got" = "$pin"
          tmux -V

      - name: Interactive TUI renders
        run: bash packaging/scripts/release-npm/smoke-tui.sh

      - name: Single-platform footprint
        env:
          TARGET: ${{ matrix.target }}
        run: |
          root="$HOME/.npm-global/lib/node_modules"
          present=$(ls "$root" | grep -E '^aiur-cli-(linux|darwin)-(x64|arm64)$' | wc -l | tr -d ' ')
          echo "platform packages installed: $present"
          test "$present" -eq 1
          test -d "$root/aiur-cli-$TARGET"

  # Exercise a non-npm package manager (bun) to confirm os/cpu resolution works
  # beyond npm. One target is enough to cover the cross-manager path.
  smoke-bun:
    name: smoke-bun linux-x64
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
      - name: Download matching platform artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aiur-cli-linux-x64
          path: artifacts
      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: Stamp and pack launcher
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: bash packaging/scripts/release-npm/stamp-and-pack-launcher.sh launcher
      - name: Global install via bun and resolve
        run: |
          export BUN_INSTALL="$HOME/.bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          bun add -g "$GITHUB_WORKSPACE"/launcher/*.tgz "$GITHUB_WORKSPACE"/artifacts/*.tgz
          "$HOME/.bun/bin/aiur" --version

  # Publish every package in lockstep. Authentication is npm OIDC trusted
  # publishing: no NPM_TOKEN anywhere in this job.
  publish:
    name: publish (${{ needs.setup.outputs.channel }})
    needs: [setup, build, smoke, smoke-bun]
    runs-on: ubuntu-latest
    permissions:
      # Required for the OIDC token npm exchanges for a short-lived credential.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # No registry-url here, deliberately. setup-node's registry-url writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc
      # unconditionally; with no token that resolves to an empty string, npm
      # believes auth is already configured, skips the OIDC exchange, and fails
      # with a misleading ENEEDAUTH/E404. See actions/setup-node#1551.
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # Trusted publishing needs npm >= 11.5.1; the script asserts it.
      - name: Ensure npm supports trusted publishing
        run: bash packaging/scripts/release-npm/ensure-npm.sh

      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # Never start a partial publish: require every published platform tarball.
      # darwin-x64 temporarily excluded (macos-13 runners unavailable).
      - name: Verify all platform artifacts present
        run: |
          shopt -s globstar nullglob
          tarballs=(artifacts/**/*.tgz)
          echo "found ${#tarballs[@]} platform tarballs"
          for t in linux-x64 linux-arm64 darwin-arm64; do
            if ! ls artifacts/aiur-cli-$t/*.tgz >/dev/null 2>&1; then
              echo "missing platform artifact for $t — aborting before any publish" >&2
              exit 1
            fi
          done

      - name: Stamp launcher version and dependency pins
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: bash packaging/scripts/release-npm/stamp-and-pack-launcher.sh artifacts/launcher

      # Dry-run channel stops here; the script explains why it asserts the OIDC
      # exchange (npm/cli#8525).
      - name: Dry-run publish and assert OIDC exchange
        if: needs.setup.outputs.publish != 'true'
        env:
          DIST_TAG: ${{ needs.setup.outputs.dist_tag }}
        run: bash packaging/scripts/release-npm/dry-run-publish.sh

      # No dist-tag step. An OIDC-exchanged credential authorizes `npm publish`
      # only, so `npm dist-tag add` cannot run here (npm/cli#8547) — and it is
      # what failed the last three release runs under a token, too. The lockstep
      # guarantee is preserved by ordering instead: platform packages go first,
      # and only `aiur-cli` is installed directly by users, so its dist-tag
      # cannot advance until every platform package it pins is already live.
      - name: Publish platform packages
        if: needs.setup.outputs.publish == 'true'
        env:
          DIST_TAG: ${{ needs.setup.outputs.dist_tag }}
        run: |
          for t in linux-x64 linux-arm64 darwin-arm64; do
            npm publish "$GITHUB_WORKSPACE"/artifacts/aiur-cli-$t/*.tgz \
              --tag "$DIST_TAG" --access public
          done

      - name: Publish launcher
        if: needs.setup.outputs.publish == 'true'
        env:
          DIST_TAG: ${{ needs.setup.outputs.dist_tag }}
        run: |
          npm publish "$GITHUB_WORKSPACE"/artifacts/launcher/*.tgz \
            --tag "$DIST_TAG" --access public

      - name: Verify registry state
        if: needs.setup.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          DIST_TAG: ${{ needs.setup.outputs.dist_tag }}
        run: bash packaging/scripts/release-npm/verify-registry.sh
