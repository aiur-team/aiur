name: release-npm

# Builds a native, self-contained OTP release per OS/arch and uploads each as a
# packed npm tarball, then publishes all of them to npm in lockstep.
#
# Publishing uses npm OIDC trusted publishing, not an npm token. npm matches the
# trusted publisher on this workflow's filename, so every channel — stable,
# nightly, dry run — is triggered on THIS file. A separate publishing workflow,
# or a reusable-workflow indirection, presents a different `workflow_ref` claim
# and is rejected (npm/documentation#1755).
#
# Channels:
#   stable   push of a v* tag, or workflow_dispatch with channel=stable.
#            Version comes from src/mix.exs; a tag must agree with it.
#            Publishes under `latest`.
#   nightly  the nightly schedule, or workflow_dispatch with channel=nightly.
#            Version is <mix.exs>-nightly.<short-sha>, published under the
#            `nightly` dist-tag. Never touches `latest` or `next`.
#   dry-run  default for workflow_dispatch. Builds, smokes, and runs
#            `npm publish --dry-run`. Nothing reaches the registry.
on:
  push:
    tags:
      - "v*"
  schedule:
    # Nightly cut. GitHub cron is UTC and has no DST handling: 07:00 UTC is
    # 00:00 America/Los_Angeles while PDT is in effect, and 23:00 the previous
    # day under PST. The "did main move" gate below keys off the head commit,
    # not the calendar, so that one-hour drift can neither skip nor double-cut.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options:
          - dry-run
          - nightly
          - stable
        default: dry-run

permissions:
  contents: read

jobs:
  # Resolve one version for the whole run and decide whether it should proceed.
  # Every downstream job reads these outputs; nothing recomputes a version.
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      # src/mix.exs is the single source of truth for the Aiur version. The
      # checked-in npm package.json files must already agree with it, so a local
      # `npm pack` and a published tarball can never disagree.
      - name: Verify checked-in package versions match mix.exs
        run: |
          base=$(node packaging/scripts/resolve-version.mjs --channel stable --format plain)
          pkg=$(node -p "require('./packaging/npm/aiur-cli/package.json').version")
          echo "mix.exs=$base packaging/npm/aiur-cli=$pkg"
          if [ "$base" != "$pkg" ]; then
            echo "version drift: run \`node packaging/scripts/stamp-versions.mjs $base\` and commit" >&2
            exit 1
          fi

      # mix.exs must always name an UNRELEASED version. A nightly is a
      # prerelease of it, and a prerelease sorts below its base, so a base that
      # is already on the registry would produce a nightly older than something
      # published. That is the mistake that leaves the repo one bump behind.
      - name: Verify the version is unreleased
        run: |
          base=$(node packaging/scripts/resolve-version.mjs --channel stable --format plain)
          if [ -n "$(npm view "aiur-cli@$base" version 2>/dev/null || true)" ]; then
            echo "aiur-cli@$base is already published; bump src/mix.exs before releasing" >&2
            exit 1
          fi

      # The platform set this release publishes must equal the set aiur-cli pins
      # as optionalDependencies, and both must match platforms.mjs. A pin with no
      # published package is the silent-broken-install defect from #2110 — CI
      # enforces it on every PR, and a release run re-checks before publishing.
      - name: Check platform publish/pin drift
        run: node packaging/scripts/check-platform-drift.mjs

      - name: Resolve channel and version
        id: resolve
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            channel=stable
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            channel=nightly
          else
            channel="${{ inputs.channel }}"
            channel="${channel:-dry-run}"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          node packaging/scripts/resolve-version.mjs \
            --channel "$([ "$channel" = "dry-run" ] && echo dev || echo "$channel")" \
            --tag "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --run "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      # A nightly is worth cutting only if main moved. The nightly version
      # embeds the head sha, so "already on the registry" is exactly "no new
      # commits since the last nightly". No new commits means no publish, and a
      # no-op run is the correct outcome.
      - name: Gate nightly on new commits
        id: gate
        run: |
          channel="${{ steps.resolve.outputs.channel }}"
          version="${{ steps.resolve.outputs.version }}"
          if [ "$channel" != "nightly" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(npm view "aiur-cli@$version" version 2>/dev/null || true)" ]; then
            echo "aiur-cli@$version is already published; main has not moved since the last nightly"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "cutting nightly $version"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          {
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| channel | ${{ steps.resolve.outputs.channel }} |"
            echo "| version | ${{ steps.resolve.outputs.version }} |"
            echo "| dist-tag | ${{ steps.resolve.outputs.dist_tag || 'none' }} |"
            echo "| publishes | ${{ steps.resolve.outputs.publish }} |"
            echo "| proceeding | ${{ steps.gate.outputs.proceed }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.target }}
    needs: setup
    if: needs.setup.outputs.proceed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-14
            target: darwin-arm64
          # darwin-x64 (Intel Mac) temporarily disabled: macos-13 hosted runners
          # are unavailable and queue indefinitely. Re-enable when an Intel runner
          # (hosted or self-hosted) is available.
          # - runner: macos-13
          #   target: darwin-x64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Single installer for Erlang/Elixir across all four images, matching the
      # versions the rest of CI uses (mise.toml). setup-beam does not
      # provide prebuilt OTP on macOS, so mise is the cross-platform choice.
      - name: Set up mise tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          # Pin mise itself; bump only in a CI-validated commit.
          version: "2026.8.8"
          install: true
          cache: true

      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/deps
          key: ${{ runner.os }}-${{ matrix.target }}-mix-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-mix-

      - name: Build release
        id: build
        env:
          MIX_ENV: prod
        run: |
          release_dir=$(bash packaging/scripts/build-release.sh)
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Assemble platform package
        id: assemble
        run: |
          out=$(node packaging/scripts/assemble-platform-package.mjs \
            --release "${{ steps.build.outputs.release_dir }}" \
            --target "${{ matrix.target }}" \
            --version "${{ needs.setup.outputs.version }}")
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Verify local layout assets in release packages
        run: |
          node packaging/scripts/check-layout-assets-release.mjs --release "${{ steps.build.outputs.release_dir }}"
          node packaging/scripts/check-layout-assets-release.mjs --release "${{ steps.assemble.outputs.out }}/release"

      - name: Pack tarball
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "${{ steps.assemble.outputs.out }}"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aiur-cli-${{ matrix.target }}
          path: dist/*.tgz
          if-no-files-found: error

  # Prove a real global install yields a working interactive aiur on each target
  # — not just --version. Runs on tags and on workflow_dispatch dry runs.
  smoke:
    name: smoke ${{ matrix.target }}
    needs: [setup, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-14
            target: darwin-arm64
          # darwin-x64 (Intel Mac) temporarily disabled: macos-13 hosted runners
          # are unavailable and queue indefinitely. Re-enable when an Intel runner
          # (hosted or self-hosted) is available.
          # - runner: macos-13
          #   target: darwin-x64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install tmux
          else
            sudo apt-get update && sudo apt-get install -y tmux
          fi
          tmux -V

      - name: Download matching platform artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aiur-cli-${{ matrix.target }}
          path: artifacts

      - name: Stamp and pack launcher
        run: |
          node packaging/scripts/stamp-versions.mjs "${{ needs.setup.outputs.version }}"
          mkdir -p launcher
          cd packaging/npm/aiur-cli
          npm pack --pack-destination "$GITHUB_WORKSPACE/launcher"

      # --offline proves aiur's OWN packages install with no registry round-trip
      # (the platform tarballs are local; optional deps for the other targets are
      # skipped, leaving a single-platform footprint). The postinstall still
      # provisions the pinned opencode ONLINE — installOpencode forces
      # --no-offline so it never inherits this --offline context — which the
      # "Peer deps provisioned" step below asserts.
      - name: Global install from local tarballs (offline)
        run: |
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          npm install -g --offline "$GITHUB_WORKSPACE"/launcher/*.tgz "$GITHUB_WORKSPACE"/artifacts/*.tgz

      - name: Version pre-check
        run: aiur --version

      # Regression guard for the offline-inheritance bug: a plain install must
      # leave the interactive peer deps ready so `aiur init` works with nothing
      # else to install. tmux is installed above; opencode is provisioned by the
      # postinstall even though the outer install ran --offline.
      - name: Peer deps provisioned (pinned opencode + tmux)
        run: |
          pin=$(node -p "require('$GITHUB_WORKSPACE/packaging/npm/aiur-cli/package.json').opencodeVersion")
          got=$(opencode --version)
          echo "opencode: want $pin, got $got"
          test "$got" = "$pin"
          tmux -V

      - name: Interactive TUI renders
        run: |
          mkdir -p fixture/.aiur
          # `.aiur/config` is plain YAML. It is NOT the old `.aiurconfig`
          # front-matter form (`---` / config / `---` / markdown body): wrapping
          # it in document markers makes the parser yield an empty config, so
          # every key here is silently ignored — including base_branch, whose
          # absence then raises at boot as if the key were never written.
          cat > fixture/.aiur/config <<'EOF'
          tracker:
            kind: memory
            # Required: Config.base_branch/2 raises rather than defaulting, so a
            # fixture without it fails the boot with an unresolved-config error
            # that reads like a packaging fault rather than a missing key.
            base_branch: main
          polling:
            interval_seconds: 5
          max_vertical_panes: 3
          pre_warmed_sessions: 0
          server:
            host: 127.0.0.1
            port: 4000
          workspace:
            root: /tmp/aiur-smoke-workspaces
          EOF
          cd fixture
          tmux new-session -d -s smoke -x 200 -y 50 "cd $PWD; aiur >run.log 2>&1"
          for i in $(seq 1 40); do
            tmux capture-pane -t smoke -p 2>/dev/null | grep -q 'AIUR' && break
            sleep 1
          done
          tmux capture-pane -t smoke -p | tee pane.txt || true
          tmux send-keys -t smoke q 2>/dev/null || true
          if ! grep -q 'AIUR' pane.txt; then
            echo "TUI did not render; run log:" >&2
            cat run.log >&2 || true
            exit 1
          fi

      - name: Single-platform footprint
        run: |
          root="$HOME/.npm-global/lib/node_modules"
          present=$(ls "$root" | grep -E '^aiur-cli-(linux|darwin)-(x64|arm64)$' | wc -l | tr -d ' ')
          echo "platform packages installed: $present"
          test "$present" -eq 1
          test -d "$root/aiur-cli-${{ matrix.target }}"

  # Exercise a non-npm package manager (bun) to confirm os/cpu resolution works
  # beyond npm. One target is enough to cover the cross-manager path.
  smoke-bun:
    name: smoke-bun linux-x64
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
      - name: Download matching platform artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aiur-cli-linux-x64
          path: artifacts
      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: Stamp and pack launcher
        run: |
          node packaging/scripts/stamp-versions.mjs "${{ needs.setup.outputs.version }}"
          mkdir -p launcher
          cd packaging/npm/aiur-cli
          npm pack --pack-destination "$GITHUB_WORKSPACE/launcher"
      - name: Global install via bun and resolve
        run: |
          export BUN_INSTALL="$HOME/.bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          bun add -g "$GITHUB_WORKSPACE"/launcher/*.tgz "$GITHUB_WORKSPACE"/artifacts/*.tgz
          "$HOME/.bun/bin/aiur" --version

  # Publish every package in lockstep. Authentication is npm OIDC trusted
  # publishing: no NPM_TOKEN anywhere in this job.
  publish:
    name: publish (${{ needs.setup.outputs.channel }})
    needs: [setup, build, smoke, smoke-bun]
    runs-on: ubuntu-latest
    permissions:
      # Required for the OIDC token npm exchanges for a short-lived credential.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # No registry-url here, deliberately. setup-node's registry-url writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc
      # unconditionally; with no token that resolves to an empty string, npm
      # believes auth is already configured, skips the OIDC exchange, and fails
      # with a misleading ENEEDAUTH/E404. See actions/setup-node#1551.
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # Trusted publishing needs npm >= 11.5.1. Node 24.5+ bundles a new enough
      # npm and Node 22 never will (it tops out at 10.9.8), but the bundled
      # version is not a contract, so assert it. An npm that is too old fails
      # the publish with an opaque auth error instead of a clear one.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          node -e '
            const need = [11, 5, 1];
            const got = process.argv[1].split(".").map(Number);
            for (let i = 0; i < 3; i++) {
              if (got[i] > need[i]) break;
              if (got[i] < need[i]) {
                console.error(`npm ${process.argv[1]} is older than 11.5.1; OIDC trusted publishing is unsupported`);
                process.exit(1);
              }
            }
          ' "$(npm --version)"
          test ! -f ~/.npmrc || ! grep -q _authToken ~/.npmrc

      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # Never start a partial publish: require every published platform tarball.
      # darwin-x64 temporarily excluded (macos-13 runners unavailable).
      - name: Verify all platform artifacts present
        run: |
          shopt -s globstar nullglob
          tarballs=(artifacts/**/*.tgz)
          echo "found ${#tarballs[@]} platform tarballs"
          for t in linux-x64 linux-arm64 darwin-arm64; do
            if ! ls artifacts/aiur-cli-$t/*.tgz >/dev/null 2>&1; then
              echo "missing platform artifact for $t — aborting before any publish" >&2
              exit 1
            fi
          done

      - name: Stamp launcher version and dependency pins
        run: node packaging/scripts/stamp-versions.mjs "${{ needs.setup.outputs.version }}"

      - name: Pack launcher
        run: |
          mkdir -p artifacts/launcher
          cd packaging/npm/aiur-cli
          npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/launcher"

      # Dry-run channel stops here. `npm publish --dry-run` still attempts the
      # OIDC exchange but swallows a failure and returns 0 (npm/cli#8525), so a
      # broken trusted-publisher config would pass silently. Run it verbose and
      # fail on the exchange-failure log line instead: that is currently the
      # only preflight that actually proves OIDC before a real publish.
      - name: Dry-run publish and assert OIDC exchange
        if: needs.setup.outputs.publish != 'true'
        run: |
          set -o pipefail
          fail=0
          # The dry-run resolves a `dev` prerelease version, and npm refuses to
          # publish any prerelease without an explicit --tag. Without this the
          # run dies on argument validation *before* attempting the exchange, so
          # the OIDC assertion below never executes. The tag is inert here (a
          # dry run publishes nothing); it exists only to get npm far enough to
          # authenticate.
          tag="${{ needs.setup.outputs.dist_tag }}"
          tag="${tag:-dev}"
          for tgz in "$GITHUB_WORKSPACE"/artifacts/aiur-cli-*/*.tgz "$GITHUB_WORKSPACE"/artifacts/launcher/*.tgz; do
            echo "::group::dry-run $(basename "$tgz")"
            npm publish "$tgz" --dry-run --tag "$tag" --access public --loglevel verbose 2>&1 | tee out.log
            echo "::endgroup::"
            if grep -q "Failed token exchange request" out.log; then
              echo "OIDC token exchange FAILED for $(basename "$tgz")" >&2
              grep -i oidc out.log >&2 || true
              fail=1
            # Absence of a failure line is not proof of success: if npm exits
            # before it ever reaches auth, nothing failed and nothing happened.
            # Require positive evidence that the exchange was attempted, or this
            # preflight silently certifies a config it never exercised.
            elif ! grep -qiE 'oidc|trusted publish' out.log; then
              echo "No OIDC exchange was attempted for $(basename "$tgz"); this preflight proved nothing." >&2
              fail=1
            fi
          done
          exit "$fail"

      # No dist-tag step. An OIDC-exchanged credential authorizes `npm publish`
      # only, so `npm dist-tag add` cannot run here (npm/cli#8547) — and it is
      # what failed the last three release runs under a token, too. The lockstep
      # guarantee is preserved by ordering instead: platform packages go first,
      # and only `aiur-cli` is installed directly by users, so its dist-tag
      # cannot advance until every platform package it pins is already live.
      - name: Publish platform packages
        if: needs.setup.outputs.publish == 'true'
        run: |
          for t in linux-x64 linux-arm64 darwin-arm64; do
            npm publish "$GITHUB_WORKSPACE"/artifacts/aiur-cli-$t/*.tgz \
              --tag "${{ needs.setup.outputs.dist_tag }}" --access public
          done

      - name: Publish launcher
        if: needs.setup.outputs.publish == 'true'
        run: |
          npm publish "$GITHUB_WORKSPACE"/artifacts/launcher/*.tgz \
            --tag "${{ needs.setup.outputs.dist_tag }}" --access public

      - name: Verify registry state
        if: needs.setup.outputs.publish == 'true'
        run: |
          v="${{ needs.setup.outputs.version }}"
          tag="${{ needs.setup.outputs.dist_tag }}"
          {
            echo "| package | published | $tag | latest |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          # The registry is read-your-writes only after propagation: `npm view`
          # can 404 for a version `npm publish` has already accepted. Polling a
          # bounded window distinguishes "not published" from "not visible yet".
          # Without this every successful publish still failed the job — four
          # consecutive nightlies and the v0.0.5 cut all published correctly and
          # were reported red. A publish path that is red on success is one
          # nobody trusts, which is how the registry sat at 0.0.3 unnoticed.
          await_registry() {
            pkg_ref="$1"
            field="$2"
            want="$3"
            deadline=$((SECONDS + 300))
            delay=5
            while :; do
              got=$(npm view "$pkg_ref" "$field" 2>/dev/null || true)
              if [ "$got" = "$want" ]; then
                printf '%s' "$got"
                return 0
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "registry did not converge: $pkg_ref $field=${got:-<absent>} want=$want" >&2
                return 1
              fi
              sleep "$delay"
              # `[ ... ] && x=y` would be a failing AND-list once the cap is
              # reached, which `bash -e` treats as fatal. Keep it an if.
              if [ "$delay" -lt 30 ]; then
                delay=$((delay * 2))
              fi
            done
          }
          # Verify EVERY package the manifest pins (plus the launcher itself)
          # resolves on the registry at this version. Deriving the list from the
          # pinned optionalDependencies means a platform the publish loop skipped
          # can never pass this check (see #2110).
          for pkg in aiur-cli $(node -e 'const d=require("./packaging/npm/aiur-cli/package.json").optionalDependencies||{}; process.stdout.write(Object.keys(d).join(" "))'); do
            await_registry "$pkg@$v" version "$v" >/dev/null
            tagged=$(await_registry "$pkg" "dist-tags.$tag" "$v")
            latest=$(npm view "$pkg" dist-tags.latest 2>/dev/null || true)
            # A nightly must never become the default install.
            if [ "$tag" != "latest" ] && [ "$latest" = "$v" ]; then
              echo "$pkg: latest moved to $v on a $tag cut" >&2
              exit 1
            fi
            echo "| $pkg | $v | $tagged | $latest |" >> "$GITHUB_STEP_SUMMARY"
          done
