name: Claude adapter release monitor

on:
  schedule:
    - cron: "19 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Required Claude adapter release is published
        run: node packaging/scripts/check-claude-adapter-release.mjs --upstream-main
