name: website

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"

# Initial PR runs share a stable group; reruns and every non-PR event get a
# unique group so they cannot replace another pending or in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  guards:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Golden snapshot assert
        run: npm run assert
      - name: Build
        run: npm run build
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - name: Install docs deps
        working-directory: website/docs-app
        run: bun install --frozen-lockfile
      - name: Build docs
        working-directory: website/docs-app
        run: bun run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test brand accessibility and theme navigation
        run: npm run test:brand
