name: website

on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Full commit SHA just published to production (does not deploy)
        required: true
        type: string
  pull_request:
    # Drafts skip until ready_for_review; a close only cancels the PR's queued run (#4942).
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths:
      - "website/**"
      - "components.json"
      - "components/**"
      - "components.schema.json"
      - "scripts/check-docs-prose.mjs"
      - ".github/workflows/website.yml"
  push:
    # Validate the website/docs build on main itself (PR branches alone let a
    # broken main build go unnoticed). Production deploys are manual.
    branches:
      - main
    paths:
      - "website/**"
      - "components.json"
      - "components/**"
      - "components.schema.json"
      - "scripts/check-docs-prose.mjs"
      - ".github/workflows/website.yml"

# Initial PR runs share a stable group; reruns and every non-PR event get a
# unique group so they cannot replace another pending or in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  guards:
    if: ${{ github.event.pull_request.draft != true && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Validate deployed SHA
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: '[[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.deployed_sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Golden snapshot assert
        run: npm run assert
      - name: Test post-deploy smoke gate
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/test-published-docs.mjs
      - name: Build
        run: npm run build
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - name: Install docs deps
        working-directory: website/docs-app
        run: bun install --frozen-lockfile
      - name: Check CLI reference
        working-directory: website/docs-app
        run: npm run check:cli-reference && bash scripts/test-check-cli-reference.sh
      - name: Build docs
        working-directory: website/docs-app
        run: bun run build
      - name: Test components loader
        working-directory: website/docs-app
        run: bun run test:components
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test brand accessibility and theme navigation
        run: npm run test:brand
      - name: Test visual regressions
        run: |
          npm run test:visual:docker
      - name: Upload visual test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-visual-results
          path: website/test-results/
          retention-days: 7
      - name: Post-deploy docs smoke check
        if: github.event_name != 'pull_request'
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        # Pushes do not deploy. Dispatch after a manual production publish,
        # rebuilding that exact SHA so stale/unreachable deploys still fail.
        run: |
          if [[ -z "$DEPLOYED_SHA" ]]; then
            echo "SKIP: no production deploy triggered for this SHA (production deploys are manual)"
            exit 0
          fi
          bash scripts/smoke-published-docs.sh
