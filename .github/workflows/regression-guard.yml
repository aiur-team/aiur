name: regression-guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if regression suite changed without operator approval
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATOR_LABELERS: its-everdred
          OVERRIDE_LABEL: regression-suite-change
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          protected_changed_files() {
            grep -q '^src/test/aiur/regression/' "$1"
          }

          latest_guard_timeline_event() {
            gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/timeline" \
              -H "Accept: application/vnd.github+json" \
              --jq '
                .[] |
                if .event == "committed" then
                  [.event, (.sha // .commit_id // "unknown")]
                elif ((.event == "labeled" or .event == "unlabeled") and .label.name == env.OVERRIDE_LABEL) then
                  [.event, .actor.login]
                else
                  empty
                end |
                @tsv
              ' |
              tail -n 1
          }

          require_operator_approval() {
            latest_event="$1"

            if [ -z "$latest_event" ]; then
              echo "::error::This PR carries the regression-suite-change label, but no label timeline event was found for operator approval."
              return 1
            fi

            label_event="${latest_event%%$'\t'*}"
            label_actor="${latest_event#*$'\t'}"

            if [ "$label_event" = "committed" ]; then
              echo "::error::A commit was added after regression-suite-change approval. Remove and re-apply the operator label after the latest push."
              return 1
            fi

            if [ "$label_event" != "labeled" ]; then
              echo "::error::The latest regression-suite-change label event is '${label_event}', not an active operator approval."
              return 1
            fi

            case " ${OPERATOR_LABELERS} " in
              *" ${label_actor} "*)
                echo "PR touches src/test/aiur/regression/ and was approved with regression-suite-change by ${label_actor}. Allowed."
                ;;
              *)
                echo "::error::The regression-suite-change label was applied by '${label_actor}', not an operator allowed to approve characterization test edits."
                return 1
                ;;
            esac
          }

          run_guard_regression_tests() {
            rename_fixture="$(mktemp)"
            printf '%s\n' 'docs/renamed_test.exs' 'src/test/aiur/regression/renamed_test.exs' > "$rename_fixture"

            if ! protected_changed_files "$rename_fixture"; then
              echo "::error::Regression guard self-test failed: rename-out fixture was not treated as protected."
              return 1
            fi

            stale_event=$'committed\tdeadbeef'

            if require_operator_approval "$stale_event" >/dev/null 2>&1; then
              echo "::error::Regression guard self-test failed: commit-after-label fixture was approved."
              return 1
            fi
          }

          run_guard_regression_tests

          changed_files="$(mktemp)"
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$changed_files"

          if ! protected_changed_files "$changed_files"; then
            echo "No files under src/test/aiur/regression/ changed. Guard passes."
            exit 0
          fi

          has_override_label="$(
            gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}" \
              --jq '.labels | map(.name) | index(env.OVERRIDE_LABEL) != null'
          )"

          if [ "$has_override_label" != "true" ]; then
            echo "::error::This PR modifies files under src/test/aiur/regression/ without the operator-applied regression-suite-change label. Characterization tests are read-only: a failing characterization test means your change is wrong. Revert the test edits, or have the operator apply the regression-suite-change label."
            exit 1
          fi

          require_operator_approval "$(latest_guard_timeline_event)"
