name: regression-guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

# A newer push or relabel supersedes an older run for this PR. The dismissal
# job also rechecks the live head immediately before it mutates labels.
concurrency:
  group: regression-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Tie approval to the current pushed code without trusting commit dates.
  dismiss-regression-override-on-push:
    if: github.event.action == 'synchronize'
    outputs:
      reapproval: ${{ steps.dismiss.outputs.reapproval }}
    permissions:
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - id: dismiss
        name: Remove regression override after every push
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PUSHED_AT: ${{ github.event.pull_request.updated_at }}
          OPERATOR_LABELERS: its-everdred
          OVERRIDE_LABEL: regression-suite-change
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          latest_override_label_event() {
            gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/timeline" \
              -H "Accept: application/vnd.github+json" \
              --jq '
                .[] |
                if ((.event == "labeled" or .event == "unlabeled") and .label.name == env.OVERRIDE_LABEL) then
                  [.event, .actor.login, .created_at]
                else
                  empty
                end |
                @tsv
              ' |
              LC_ALL=C sort -k3,3 |
              tail -n 1
          }

          override_applied_after_push() {
            latest_event="$1"
            pushed_at="$2"

            if [ -z "$latest_event" ] || [ -z "$pushed_at" ]; then
              return 1
            fi

            label_event="${latest_event%%$'\t'*}"
            latest_event="${latest_event#*$'\t'}"
            label_actor="${latest_event%%$'\t'*}"
            label_created_at="${latest_event#*$'\t'}"

            [ "$label_event" = "labeled" ] && [ -n "$label_created_at" ] &&
              [[ "$label_created_at" > "$pushed_at" ]]
          }

          run_dismissal_regression_tests() {
            if ! override_applied_after_push \
                $'labeled\tits-everdred\t2026-07-11T12:00:01Z' "2026-07-11T12:00:00Z"; then
              echo "::error::Regression guard self-test failed: newer operator reapproval was not preserved."
              return 1
            fi

            if override_applied_after_push \
                $'labeled\tits-everdred\t2026-07-11T11:59:59Z' "2026-07-11T12:00:00Z" ||
                override_applied_after_push \
                  $'unlabeled\tits-everdred\t2026-07-11T12:00:01Z' "2026-07-11T12:00:00Z"; then
              echo "::error::Regression guard self-test failed: stale or inactive approval was preserved."
              return 1
            fi
          }

          run_dismissal_regression_tests

          current_head_sha="$(
            gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha'
          )"

          if [ "$current_head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "Skipping stale synchronize event for ${EVENT_HEAD_SHA}; PR head is now ${current_head_sha}."
            exit 0
          fi

          has_override_label="$(
            gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}" \
              --jq '.labels | map(.name) | index(env.OVERRIDE_LABEL) != null'
          )"

          if [ "$has_override_label" != "true" ]; then
            echo "No regression-suite-change label to remove after this push."
            exit 0
          fi

          # This intentionally runs for every push, before inspecting PR content.
          # Preserve an operator label applied after this push: both timestamps
          # are server-recorded and cannot be forged in a Git commit.
          latest_label_event="$(latest_override_label_event)"

          if override_applied_after_push "$latest_label_event" "$EVENT_PUSHED_AT"; then
            case " ${OPERATOR_LABELERS} " in
              *" ${label_actor} "*)
                echo "reapproval=true" >> "$GITHUB_OUTPUT"
                echo "A newer operator regression-suite-change label was applied after this push; preserving it for the dependent guard."
                exit 0
                ;;
            esac
          fi

          current_head_sha="$(
            gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha'
          )"

          if [ "$current_head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "Skipping stale synchronize event for ${EVENT_HEAD_SHA}; PR head is now ${current_head_sha}."
            exit 0
          fi

          gh api --method DELETE \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels/${OVERRIDE_LABEL}"
          echo "Removed regression-suite-change after push; operator approval is required again."

  guard:
    needs: dismiss-regression-override-on-push
    # On synchronize, wait for label dismissal before reading approval state.
    # `always()` lets this required job fail closed if dismissal itself fails.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if regression suite changed without operator approval
        env:
          DISMISS_RESULT: ${{ needs.dismiss-regression-override-on-push.result }}
          DISMISS_REAPPROVAL: ${{ needs.dismiss-regression-override-on-push.outputs.reapproval }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_LABELER: ${{ github.event.sender.login }}
          GH_TOKEN: ${{ github.token }}
          OPERATOR_LABELERS: its-everdred
          OVERRIDE_LABEL: regression-suite-change
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          readonly PR_FILE_API_LIMIT=3000

          protected_changed_files() {
            local changed_files="$1"
            local jq_status

            if jq -e -s \
                'any(.[]; any(.[]; startswith("src/test/aiur/regression/")))' \
                "$changed_files" >/dev/null 2>&1; then
              return 0
            else
              jq_status=$?
            fi

            # `jq -e` returns 1 for a valid list with no match. Parse/type
            # errors are unverifiable and use a distinct status.
            [ "$jq_status" -eq 1 ] && return 1
            return 2
          }

          valid_file_count() {
            case "$1" in
              '' | *[!0-9]*)
                return 1
                ;;
              *)
                return 0
                ;;
            esac
          }

          file_list_requires_approval() {
            local listed_file_count="$1"
            local total_changed_files="$2"

            if ! valid_file_count "$listed_file_count" ||
                ! valid_file_count "$total_changed_files"; then
              return 0
            fi

            [ "$listed_file_count" -ge "$PR_FILE_API_LIMIT" ] ||
              [ "$listed_file_count" -ne "$total_changed_files" ]
          }

          changes_require_approval() {
            local changed_files="$1"
            local listed_file_count="$2"
            local total_changed_files="$3"
            local protected_status

            if file_list_requires_approval "$listed_file_count" "$total_changed_files"; then
              return 0
            fi

            if protected_changed_files "$changed_files"; then
              return 0
            else
              protected_status=$?
            fi

            # A malformed JSON record is unverifiable and therefore follows
            # the same approval path as an incomplete API response.
            [ "$protected_status" -ne 1 ]
          }

          require_current_head() {
            local event_head_sha="$1"
            local current_head_sha="$2"

            if [ -z "$event_head_sha" ] || [ -z "$current_head_sha" ] ||
                [ "$event_head_sha" != "$current_head_sha" ]; then
              echo "::error::The guard event applies to ${event_head_sha:-an unknown head}, but the PR head is now ${current_head_sha:-unknown}. Wait for the latest head's guard run, then re-apply the operator label if approval is required."
              return 1
            fi
          }

          require_fresh_approval() {
            event_action="$1"
            dismiss_result="$2"
            has_override_label="$3"
            dismiss_reapproval="$4"

            if [ "$event_action" != "synchronize" ]; then
              return 0
            fi

            if [ "$dismiss_result" != "success" ]; then
              echo "::error::Regression guard cannot verify a post-push approval because label dismissal did not succeed (result: ${dismiss_result})."
              return 1
            fi

            if [ "$has_override_label" = "true" ]; then
              if [ "$dismiss_reapproval" = "true" ]; then
                return 0
              fi

              echo "::error::The regression-suite-change label survived a push. Re-apply the operator label after the current head is settled."
              return 1
            fi
          }

          require_active_override_label() {
            local has_override_label="$1"
            local approval_error="${2:-This PR modifies files under src/test/aiur/regression/ without the operator-applied regression-suite-change label. Characterization tests are read-only: a failing characterization test means your change is wrong. Revert the test edits, or have the operator apply the regression-suite-change label.}"

            if [ "$has_override_label" != "true" ]; then
              echo "::error::${approval_error}"
              return 1
            fi
          }

          require_current_operator_approval() {
            local event_action="$1"
            local event_label="$2"
            local event_labeler="$3"
            local event_head_sha="$4"
            local current_head_sha="$5"
            local dismiss_reapproval="$6"

            if ! require_current_head "$event_head_sha" "$current_head_sha"; then
              return 1
            fi

            if [ "$event_action" = "synchronize" ] && [ "$dismiss_reapproval" = "true" ]; then
              echo "This PR requires regression-suite approval and has a newer operator approval for the current head. Allowed."
              return 0
            fi

            if [ "$event_action" != "labeled" ] || [ "$event_label" != "$OVERRIDE_LABEL" ]; then
              echo "::error::This PR needs a fresh regression-suite-change label from an operator after the latest push."
              return 1
            fi

            case " ${OPERATOR_LABELERS} " in
              *" ${event_labeler} "*)
                echo "This PR requires regression-suite approval and was approved with regression-suite-change by ${event_labeler}. Allowed."
                ;;
              *)
                echo "::error::The regression-suite-change label was applied by '${event_labeler}', not an operator allowed to approve characterization test edits."
                return 1
                ;;
            esac
          }

          write_changed_file_record() {
            jq -cn --arg current_filename "$1" --arg previous_filename "$2" \
              '[$current_filename, $previous_filename]'
          }

          run_guard_regression_tests() {
            local hostile_filename_fixture hostile_record_count malformed_record_fixture
            local rename_fixture unprotected_fixture

            rename_fixture="$(mktemp)"
            write_changed_file_record \
              'docs/renamed_test.exs' \
              'src/test/aiur/regression/renamed_test.exs' > "$rename_fixture"

            if ! protected_changed_files "$rename_fixture"; then
              echo "::error::Regression guard self-test failed: rename-out fixture was not treated as protected."
              return 1
            fi

            unprotected_fixture="$(mktemp)"
            write_changed_file_record 'src/test/aiur/ordinary_test.exs' '' > "$unprotected_fixture"

            if protected_changed_files "$unprotected_fixture"; then
              echo "::error::Regression guard self-test failed: ordinary fixture was treated as protected."
              return 1
            fi

            hostile_filename_fixture="$(mktemp)"
            write_changed_file_record \
              $'docs/marker-like\tname\nwith\\slashes.exs' \
              $'src/test/aiur/regression/renamed\nfile.exs' > "$hostile_filename_fixture"

            hostile_record_count="$(wc -l < "$hostile_filename_fixture" | tr -d '[:space:]')"

            if [ "$hostile_record_count" != "1" ] ||
                ! protected_changed_files "$hostile_filename_fixture"; then
              echo "::error::Regression guard self-test failed: hostile filename fixture corrupted record framing or hid a protected rename."
              return 1
            fi

            if changes_require_approval "$unprotected_fixture" "1" "1" ||
                changes_require_approval "$unprotected_fixture" "2999" "2999"; then
              echo "::error::Regression guard self-test failed: complete ordinary file list required approval."
              return 1
            fi

            malformed_record_fixture="$(mktemp)"
            printf '%s\n' 'not-json!' > "$malformed_record_fixture"

            if ! changes_require_approval "$unprotected_fixture" "3000" "3000" ||
                ! changes_require_approval "$unprotected_fixture" "3001" "3001" ||
                ! changes_require_approval "$unprotected_fixture" "3000" "3001" ||
                ! changes_require_approval "$unprotected_fixture" "not-a-count" "1" ||
                ! changes_require_approval "$unprotected_fixture" "1" "not-a-count" ||
                ! changes_require_approval "$malformed_record_fixture" "1" "1" ||
                ! changes_require_approval "$rename_fixture" "1" "1"; then
              echo "::error::Regression guard self-test failed: capped, mismatched, malformed, or protected fixture bypassed approval."
              return 1
            fi

            if require_current_head "head-before-push" "head-after-push" >/dev/null 2>&1 ||
                ! require_current_head "head-after-push" "head-after-push" >/dev/null 2>&1; then
              echo "::error::Regression guard self-test failed: current-head fixture did not fail closed."
              return 1
            fi

            if ! require_current_operator_approval \
                "labeled" "$OVERRIDE_LABEL" "its-everdred" "head-before-push" "head-before-push" "" \
                >/dev/null 2>&1; then
              echo "::error::Regression guard self-test failed: operator label fixture was rejected."
              return 1
            fi

            if require_current_operator_approval \
                "labeled" "$OVERRIDE_LABEL" "executor" "head-after-push" "head-after-push" "" \
                >/dev/null 2>&1; then
              echo "::error::Regression guard self-test failed: non-operator label fixture was approved."
              return 1
            fi

            # The approval event was for the old head; synchronize is
            # GitHub's server-recorded signal that a later push changed it.
            # This begins the end-to-end freshness fixture without depending
            # on commit or timeline ordering.
            if require_current_operator_approval \
                "labeled" "$OVERRIDE_LABEL" "its-everdred" "head-before-push" "head-after-push" "" \
                >/dev/null 2>&1; then
              echo "::error::Regression guard self-test failed: stale operator approval fixture was approved."
              return 1
            fi

            if require_fresh_approval "synchronize" "success" "true" "" >/dev/null 2>&1; then
              echo "::error::Regression guard self-test failed: post-approval push fixture was approved."
              return 1
            fi

            # The synchronizing dismissal job must clear that old label. The
            # guard first accepts the successful dismissal state, then rejects
            # its missing label; an operator can subsequently approve the new
            # head through a fresh labeled event.
            if ! require_fresh_approval "synchronize" "success" "false" "" >/dev/null 2>&1 ||
                require_active_override_label "false" >/dev/null 2>&1; then
              echo "::error::Regression guard self-test failed: dismissed post-push fixture was rejected."
              return 1
            fi

            if ! require_current_operator_approval \
                "labeled" "$OVERRIDE_LABEL" "its-everdred" "head-after-push" "head-after-push" "" \
                >/dev/null 2>&1; then
              echo "::error::Regression guard self-test failed: reapproval fixture was rejected."
              return 1
            fi

            if ! require_fresh_approval "synchronize" "success" "true" "true" >/dev/null 2>&1 ||
                ! require_current_operator_approval \
                  "synchronize" "" "" "head-after-push" "head-after-push" "true" \
                  >/dev/null 2>&1; then
              echo "::error::Regression guard self-test failed: delayed reapproval fixture was rejected."
              return 1
            fi
          }

          run_guard_regression_tests

          changed_files="$(mktemp)"
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | [.filename, (.previous_filename // "")] | @json' > "$changed_files"

          listed_file_count="$(wc -l < "$changed_files" | tr -d '[:space:]')"

          pr_metadata="$(
            gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.head.sha, (.changed_files | tostring)] | @tsv'
          )"
          IFS=$'\t' read -r current_head_sha total_changed_files <<< "$pr_metadata"

          # The list and total are live API reads, so bind them to the event head
          # before either the protected-path or ordinary fast path can succeed.
          require_current_head "$EVENT_HEAD_SHA" "$current_head_sha"

          if ! changes_require_approval "$changed_files" "$listed_file_count" "$total_changed_files"; then
            echo "No files under src/test/aiur/regression/ changed. Guard passes."
            exit 0
          fi

          if file_list_requires_approval "$listed_file_count" "$total_changed_files"; then
            approval_error="GitHub returned ${listed_file_count:-an invalid number} file records for ${total_changed_files:-an unknown number} changed files (API limit: ${PR_FILE_API_LIMIT}), so the guard cannot prove that src/test/aiur/regression/ is untouched. Review the complete git diff outside the capped API/UI listing, then have the operator apply regression-suite-change if the change is intentional."
            echo "::warning::${approval_error}"
          elif protected_changed_files "$changed_files"; then
            approval_error="This PR modifies files under src/test/aiur/regression/ without the operator-applied regression-suite-change label. Characterization tests are read-only: a failing characterization test means your change is wrong. Revert the test edits, or have the operator apply the regression-suite-change label."
          else
            approval_error="GitHub's changed-file response contained an invalid JSON record, so the guard cannot prove that src/test/aiur/regression/ is untouched. Review the complete git diff, then have the operator apply regression-suite-change if the change is intentional."
            echo "::warning::${approval_error}"
          fi

          has_override_label="$(
            gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}" \
              --jq '.labels | map(.name) | index(env.OVERRIDE_LABEL) != null'
          )"

          # On synchronize this is the end-to-end freshness check: `needs`
          # makes this API read follow the real dismissal job, and a surviving
          # label fails closed rather than relying on timeline ordering.
          require_fresh_approval "$EVENT_ACTION" "$DISMISS_RESULT" "$has_override_label" "$DISMISS_REAPPROVAL"

          require_active_override_label "$has_override_label" "$approval_error"

          require_current_operator_approval \
            "$EVENT_ACTION" "$EVENT_LABEL" "$EVENT_LABELER" "$EVENT_HEAD_SHA" "$current_head_sha" "$DISMISS_REAPPROVAL"
