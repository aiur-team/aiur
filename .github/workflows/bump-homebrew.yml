name: Bump Homebrew Formula

on:
  # Disabled until the Homebrew tap is set up: the tap repo
  # (its-everdred/homebrew-aiur) does not exist yet and the
  # HOMEBREW_TAP_TOKEN secret is unset, so a tag-triggered run only fails.
  # Re-enable the tag trigger below once both are in place.
  #   push:
  #     tags:
  #       - "v*"
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download tarball and compute SHA256
        id: sha
        run: |
          curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.version.outputs.tag }}.tar.gz" -o source.tar.gz
          sha=$(sha256sum source.tar.gz | awk '{print $1}')
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/sapsaldog/homebrew-aiur.git" tap
          cd tap
          sed -i "s|url \".*\"|url \"https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz\"|" Formula/aiur.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/aiur.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/aiur.rb
          git commit -m "Bump aiur to ${TAG}"
          git push
