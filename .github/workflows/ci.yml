name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Required for GitHub's merge queue: the queue builds each candidate on a
  # `gh-readonly-queue/<base>/pr-<n>-<sha>` ref and waits for the required
  # checks to report against it. Without this trigger no workflow runs there,
  # the required checks never appear, and every queued PR is ejected when the
  # queue's check timeout expires. See #1381.
  merge_group:
  push:
    branches:
      - main
      - v2
  # Manual re-run path: lets an operator (or an agent) trigger CI on a branch
  # head directly when the pull_request synchronize path is not creating runs
  # (#2397). Checks attach to the head commit either way.
  workflow_dispatch:

# Main pushes finish the running run; only the newest pending run is kept.
# Initial PR runs share a group; other events and all reruns stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && 'main' || format('{0}-{1}', github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

# Job timeouts (#2461): 3-4x observed duration, rounded to five minutes.
# Re-measure completed job spans when profiles change. Release smoke has
# extra headroom for cold Chromium installs and release assembly.

jobs:
  # Drafts run only changes, lint and build; the CI poller requires successful
  # required checks, so a job-level skip is not full-suite evidence.
  #
  # A pull request that touches only `website/**` (or packages/aiur-style) has
  # nothing the engine jobs can regress, so their steps short-circuit on
  # docs_only. The jobs themselves are NOT skipped: the human-only merge ruleset
  # requires 13 contexts by name (docs/security/human-only-merge-ruleset.json),
  # and a job-level `if:` skip never reports `success`, leaving the PR
  # unmergeable.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Classify the changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci/changes-classify.sh

  build:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Elixir
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: ./.github/actions/setup-elixir
      - name: Build release
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make build

  lint:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Elixir
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: ./.github/actions/setup-elixir
      - name: Format check
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make fmt-check
      - name: Credo + specs
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make lint
      - name: Cache component checker toolchain
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: scripts/components/node_modules
          key: components-${{ runner.os }}-${{ hashFiles('scripts/components/package-lock.json') }}
      # Keep guards in required lint so they remain merge-blocking.
      - name: Repository guards (config docs, components, env example, shard parity, platform drift)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/ci/lint-guards.sh

  coverage-partition:
    name: coverage (${{ matrix.partition }}/4)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    # Last-resort backstop only (#2461's measured value). The effective bound is
    # the `timeout` wrapper on the test step below: a job-level timeout CANCELS
    # the job, and a cancelled job skips its remaining steps, so the partition
    # log and the known-flaky report never run and the wedge reports as a red
    # with zero diagnostics -- observed on run 32790770281, coverage (3/4),
    # which burned 45 minutes and printed not one test name.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Elixir
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: ./.github/actions/setup-elixir
      - name: Install zsh for agent scratch regression
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y zsh
      # MIX_TEST_PARTITION still names the shard, but it is no longer read by
      # `mix test --partitions`: membership comes from each file's own path via
      # `Aiur.TestShard` (#2568); see the `coverage-partition` target in
      # src/Makefile. The variable also isolates per-shard resources in tests.
      - name: Test coverage partition
        id: partition-tests
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
          TEST_PARTITIONS: 4
          PARTITION: ${{ matrix.partition }}
          # `Aiur.TestSupport.tmp_root!/1` follows `System.tmp_dir!/0`, which
          # otherwise selects quota-mounted `/tmp` on hosted runners. Keep
          # per-test SQLite broker state under this job's private runner temp.
          TMPDIR: ${{ runner.temp }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/coverage-partition.sh"
      - name: Report shard composition
        if: ${{ (always()) && needs.changes.outputs.docs_only != 'true' }}
        shell: bash
        working-directory: .
        env:
          PARTITION: ${{ matrix.partition }}
        run: bash scripts/ci/report-shard-composition.sh
      - name: Print partition log
        if: ${{ (failure()) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: cat "$RUNNER_TEMP/coverage-partition-${{ matrix.partition }}.log"
      - name: Report known-flaky test names
        if: ${{ (failure()) && needs.changes.outputs.docs_only != 'true' }}
        shell: bash
        working-directory: .
        run: bash scripts/report-known-flaky-tests.sh "$RUNNER_TEMP/coverage-partition-${{ matrix.partition }}.log" "$GITHUB_STEP_SUMMARY"
      # Attempt-qualified artifacts survive reruns without overwriting failure evidence.
      - name: Download previous shard attempts
        continue-on-error: true
        if: ${{ always() && github.run_attempt > 1 && needs.changes.outputs.docs_only != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: shard-flake-evidence-${{ matrix.partition }}-*
          path: ${{ runner.temp }}/previous-shard-attempts
      - name: Record coverage flake ledger
        continue-on-error: true
        if: ${{ always() && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
          PARTITION_OUTCOME: ${{ steps.partition-tests.outcome }}
        run: >-
          python3 scripts/record-coverage-flakes.py
          "$RUNNER_TEMP/coverage-partition-${{ matrix.partition }}.log"
          "$PARTITION_OUTCOME" "$RUNNER_TEMP/previous-shard-attempts"
          "$RUNNER_TEMP/shard-evidence" "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage flake evidence
        continue-on-error: true
        if: ${{ always() && needs.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shard-flake-evidence-${{ matrix.partition }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard-evidence/
          if-no-files-found: error
      - name: Upload partition coverage
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.partition }}
          path: src/cover/${{ matrix.partition }}.coverdata
          if-no-files-found: error

  coverage:
    needs: [coverage-partition, changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Report failed coverage partitions
        if: ${{ (needs.coverage-partition.result != 'success') && needs.changes.outputs.docs_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: bash scripts/report-ci-failures.sh '^coverage \([1-4]/4\)$' "${{ needs.coverage-partition.result }}"
      - name: Set up Elixir
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: ./.github/actions/setup-elixir
      - name: Download partition coverage
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: src/cover
          merge-multiple: true
      - name: Verify partition coverage exports
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          for partition in 1 2 3 4; do
            test -s "cover/${partition}.coverdata"
          done
      - name: Aggregate coverage gate
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make coverage-report

  quarantine:
    name: quarantined tests (non-blocking)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Elixir
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: ./.github/actions/setup-elixir
      - name: Cache _build (dependency apps only)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # Dependency-only: first-party `aiur` beams are pruned before every
          # run so they always recompile against current source. No prefix
          # `restore-keys`: a stale _build from a different mix.lock restores
          # deps that no longer match mix.exs ("Unchecked dependencies").
          key: ${{ runner.os }}-quarantine-build-deps-${{ hashFiles('src/mix.lock', 'src/mix.exs') }}
          path: src/_build/test/lib
      - name: Drop first-party beams (always recompile against current source)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        # The cache may carry `aiur` beams predating a compile-time-visible source
        # change; removing them forces a fresh compile while deps stay cached.
        run: rm -rf _build/test/lib/aiur
      - name: Run quarantined tests
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        # `--exclude test` narrows to the tag without failing while the queue
        # is empty; unlike `--only`, that lets this non-blocking job stay green
        # until the first confirmed flake is quarantined.
        run: mix test --include quarantine --exclude test
      - name: Prune first-party beams before the cache save
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        # `mix test` recompiles the `aiur` app, so prune it again before the
        # cache post-step saves, keeping the stored cache dependency-only (the
        # path the restore step promises).
        run: rm -rf _build/test/lib/aiur

  test:
    needs: [coverage, changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Report failed coverage gate
        if: ${{ (needs.coverage.result != 'success') && needs.changes.outputs.docs_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: bash scripts/report-ci-failures.sh '^coverage( \([1-4]/4\))?$' "${{ needs.coverage.result }}"
      - name: Set up Elixir
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: ./.github/actions/setup-elixir
      - name: Install tmux for regression test
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Agent teardown reaping regression (#423)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make regression

  dialyzer:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Elixir
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: ./.github/actions/setup-elixir
      - name: Cache PLT
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/_build/dev/*.plt*
          key: ${{ runner.os }}-plt-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-
      - name: Dialyzer
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make dialyzer

  browser:
    name: browser harness
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Node
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/browser/package-lock.json
      - name: Install fixture build tools
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - name: Set up Elixir
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: ./.github/actions/setup-elixir
      - name: Cache Playwright browser
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('src/browser/package-lock.json') }}
      - name: Browser, accessibility, performance and visual harness
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: bash scripts/ci/browser-harness.sh
      - name: Upload browser failure evidence
        if: ${{ (failure()) && needs.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-harness-artifacts
          path: src/browser/.artifacts-run-*/
          if-no-files-found: ignore
          include-hidden-files: true

  streamdeck:
    name: streamdeck
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/streamdeck
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Node
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/streamdeck/package-lock.json
      - name: Install, lint, test with coverage, build
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/ci/streamdeck.sh

  layout-release:
    name: layout release smoke
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Node
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/browser/package-lock.json
      - name: Set up mise tools
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          # Pin mise itself; bump only in a CI-validated commit.
          version: "2026.8.8"
          install: true
          cache: true
      - name: Set up Bun
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: "1.4.2"
      - name: Cache Elixir dependencies
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/deps
          key: ${{ runner.os }}-layout-release-mix-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-layout-release-mix-
      - name: Test launcher, build and verify packaged release
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: bash scripts/ci/layout-release.sh
