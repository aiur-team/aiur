name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - v2

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mise tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Fetch deps
        run: make deps
      - name: Build release
        run: make build

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mise tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Fetch deps
        run: make deps
      - name: Format check
        run: make fmt-check
      - name: Credo + specs
        run: make lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mise tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Fetch deps
        run: make deps
      - name: Test with coverage
        run: make coverage
      - name: Install tmux for regression test
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Agent teardown reaping regression (#423)
        run: make regression

  dialyzer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mise tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
      - name: Cache deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Cache PLT
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/_build/dev/*.plt*
          key: ${{ runner.os }}-plt-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-
      - name: Fetch deps
        run: make deps
      - name: Dialyzer
        run: make dialyzer

  browser:
    name: browser harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/browser/package-lock.json
      - name: Set up mise tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
      - name: Cache Elixir dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Cache Playwright browser
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('src/browser/package-lock.json') }}
      - name: Fetch Elixir dependencies
        working-directory: src
        run: make deps
      - name: Install browser harness dependencies
        working-directory: src/browser
        run: npm ci
      - name: Install Chromium
        working-directory: src/browser
        run: npx playwright install --with-deps chromium
      - name: Run browser, accessibility, and performance smoke
        working-directory: src/browser
        run: npm test
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-harness-artifacts
          path: src/browser/.artifacts-run-*/
          if-no-files-found: ignore
          include-hidden-files: true
