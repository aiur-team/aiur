name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - v2

jobs:
  workflow-security:
    name: workflow security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Guard workflow triggers and action pins
        run: bash scripts/test-workflow-security.sh
      - name: Test human-only merge ruleset verifier
        run: bash scripts/test-human-only-merge-ruleset.sh

  ruleset-security:
    name: ruleset security
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify human-only merge ruleset
        # GitHub omits bypass_actors from GET responses unless the credential
        # has ruleset write visibility, so this must be an isolated auditor
        # credential rather than the daemon token.
        env:
          GH_TOKEN: ${{ secrets.RULESET_AUDITOR_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || {
            echo "RULESET_AUDITOR_TOKEN with Administration:write is required to audit repository rulesets" >&2
            exit 1
          }
          bash scripts/verify-human-only-merge-ruleset.sh

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Build release
        run: make build

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Format check
        run: make fmt-check
      - name: Credo + specs
        run: make lint

  coverage-partition:
    name: coverage (${{ matrix.partition }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Test coverage partition
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
          TEST_PARTITIONS: 4
        run: make coverage-partition
      - name: Upload partition coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.partition }}
          path: src/cover/${{ matrix.partition }}.coverdata
          if-no-files-found: error

  coverage:
    needs: coverage-partition
    if: ${{ always() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Require successful coverage partitions
        run: test "${{ needs.coverage-partition.result }}" = success
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Download partition coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: src/cover
          merge-multiple: true
      - name: Verify partition coverage exports
        run: |
          for partition in 1 2 3 4; do
            test -s "cover/${partition}.coverdata"
          done
      - name: Aggregate coverage gate
        run: make coverage-report

  test:
    needs: coverage
    if: ${{ always() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Require successful coverage gate
        run: test "${{ needs.coverage.result }}" = success
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Install tmux for regression test
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Agent teardown reaping regression (#423)
        run: make regression

  dialyzer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Cache PLT
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/_build/dev/*.plt*
          key: ${{ runner.os }}-plt-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-
      - name: Dialyzer
        run: make dialyzer

  browser:
    name: browser harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/browser/package-lock.json
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Cache Playwright browser
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('src/browser/package-lock.json') }}
      - name: Install browser harness dependencies
        working-directory: src/browser
        run: npm ci
      - name: Install Chromium
        working-directory: src/browser
        run: npx playwright install --with-deps chromium
      - name: Run browser, accessibility, and performance smoke
        working-directory: src/browser
        run: npm test
      - name: Verify browser failure evidence, redaction, and teardown
        working-directory: src/browser
        run: npm run verify:failure-artifacts
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-harness-artifacts
          path: src/browser/.artifacts-run-*/
          if-no-files-found: ignore
          include-hidden-files: true

  streamdeck:
    name: streamdeck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/streamdeck
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/streamdeck/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm test
      - name: Build
        run: npm run build

  layout-release:
    name: layout release smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/browser/package-lock.json
      - name: Set up mise tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
      - name: Cache Elixir dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/deps
          key: ${{ runner.os }}-layout-release-mix-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-layout-release-mix-
      - name: Install browser dependencies
        working-directory: src/browser
        run: npm ci
      - name: Install Chromium
        working-directory: src/browser
        run: npx playwright install --with-deps chromium
      - name: Build packaged production release
        id: build
        env:
          MIX_ENV: prod
        run: |
          release_dir=$(bash packaging/scripts/build-release.sh)
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
      - name: Assemble platform package
        id: assemble
        run: |
          out=$(node packaging/scripts/assemble-platform-package.mjs \
            --release "${{ steps.build.outputs.release_dir }}" \
            --target linux-x64 \
            --version 0.0.0-pr.${{ github.run_number }})
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - name: Verify package integrity and offline worker
        run: |
          node packaging/scripts/check-layout-assets-release.mjs --release "${{ steps.build.outputs.release_dir }}"
          node packaging/scripts/check-layout-assets-release.mjs --release "${{ steps.assemble.outputs.out }}/release"
          node src/browser/scripts/check-packaged-layout-worker.mjs --release "${{ steps.assemble.outputs.out }}/release"
