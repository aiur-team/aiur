name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir
      - name: Cache deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: elixir/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Fetch deps
        run: make deps
      - name: Build release
        run: make build

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir
      - name: Cache deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: elixir/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Fetch deps
        run: make deps
      - name: Format check
        run: make fmt-check
      - name: Credo + specs
        run: make lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir
      - name: Cache deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: elixir/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Fetch deps
        run: make deps
      - name: Test with coverage
        env:
          AIUR_DEBUG: "1"
        run: make coverage
      - name: Dump OTP log on failure
        if: failure()
        run: |
          echo "=== grep for supervisor/crash markers ==="
          grep -nE "maximum restart intensity|reached the maximum|terminating|crash report|CRASH REPORT|\\*\\* \\(EXIT\\)|shutdown|Child .* of Supervisor|exited with reason|Supervisor" log/aiur.log || echo "(no markers found)"
          echo "=== tail -n 500 log/aiur.log ==="
          tail -n 500 log/aiur.log || echo "(no log/aiur.log)"

  dialyzer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir
      - name: Cache deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: elixir/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Cache PLT
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: elixir/_build/dev/*.plt*
          key: ${{ runner.os }}-plt-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-
      - name: Fetch deps
        run: make deps
      - name: Dialyzer
        run: make dialyzer
