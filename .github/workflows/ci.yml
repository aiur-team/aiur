name: ci

on:
  pull_request:
  # Required for GitHub's merge queue: the queue builds each candidate on a
  # `gh-readonly-queue/<base>/pr-<n>-<sha>` ref and waits for the required
  # checks to report against it. Without this trigger no workflow runs there,
  # the required checks never appear, and every queued PR is ejected when the
  # queue's check timeout expires. See #1381.
  merge_group:
  push:
    branches:
      - main
      - v2

# Initial PR runs share a stable group; reruns and every non-PR event get a
# unique group so they cannot replace another pending or in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

# Job timeouts (#2461).
#
# Every job declares an explicit `timeout-minutes`. Without one, GitHub's
# 6-hour default applies and a hung job — e.g. `coverage (3/4)` in run
# 32778536520 on PR #2459, stuck 49+ minutes on runner congestion with no
# automatic recovery — blocks its PR indefinitely with no signal beyond the
# job sitting `in_progress`.
#
# Values are per job, not a single global ceiling: a number generous enough
# for the slowest job would be useless for the fastest. They were derived on
# 2026-08-24 from the `started_at`→`completed_at` span of 10 successful runs
# of this workflow (runs 32786021793, 32785247929, 32784244468, 32783855503,
# 32778536520, 32778181574, 32778043989, 32780961076, 32780225293,
# 32779697220 on aiur-team/aiur):
#
#   job                    observed max   timeout-minutes
#   workflow security         ~0.4 min              5
#   merge ruleset drift       ~0.3 min              5
#   analytics                 ~0.3 min              5
#   build                     ~2.0 min             10
#   lint                      ~3.1 min             15
#   coverage (1/4..4/4)       ~7.9 min (shard 1)   30
#   coverage (aggregate)      ~3.0 min             15
#   quarantined tests         ~2.1 min             15
#   test                      ~0.5 min             10
#   dialyzer                  ~2.7 min             15
#   browser harness           ~8.1 min             30
#   streamdeck                ~1.5 min             10
#   layout release smoke      ~2.5 min             15
#
# Rule: 3-4x the observed max duration, rounded up to a 5-minute step, with a
# 5-minute floor. The fastest guard jobs get a 5-minute ceiling (≈12x the
# observed max) so a hang there is caught quickly rather than after hours. The
# slowest shard (coverage partition 1, ~8 min) and the browser harness (~8
# min) drive the 30-minute ceiling, which would have killed the observed hang
# at ~30 minutes instead of the default six hours while leaving 3.7x headroom
# over the slowest legitimate run.
#
# Re-derive from recent runs if a job's profile changes rather than re-guessing:
#   gh api "repos/aiur-team/aiur/actions/workflows/ci.yml/runs?per_page=30&status=completed"
# then compare each job's `started_at`/`completed_at` span.

jobs:
  workflow-security:
    name: workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Guard workflow triggers and action pins
        run: bash scripts/test-workflow-security.sh
      - name: Test human-only merge ruleset verifier
        run: bash scripts/test-human-only-merge-ruleset.sh
      - name: Test human-only merge ruleset drift check
        run: bash scripts/test-human-only-merge-ruleset-live.sh
      - name: Test pull request merge-gate diagnostics
        run: bash scripts/test-pr-merge-gate-diagnostic.sh
      - name: Test CI failure diagnostics
        run: bash scripts/test-report-ci-failures.sh
      - name: Test CI run-attempt disclosure
        run: bash scripts/test-report-ci-run-attempt.sh
      - name: Test rename preflight
        run: make test-rename-preflight
      - name: Test config documentation guard
        run: bash scripts/test-check-config-docs.sh
      - name: Test env example drift guard
        run: bash scripts/test-check-env-example.sh
      - name: Test hourly retrospective visual check
        run: bash .claude/skills/aiur-run/scripts/tests/executor-retrospective_test.sh
      - name: Test hourly dashboard analyzer
        run: node --test .claude/skills/aiur-meta/scripts/tests/capture-dashboard_test.mjs
      - name: Test hourly retrospective CLI check
        run: bash .claude/skills/aiur-run/scripts/tests/executor-cli-check_test.sh

  merge-ruleset-drift:
    name: merge ruleset drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Verify live human-only merge ruleset matches the declaration
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-human-only-merge-ruleset-live.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Build release
        run: make build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Format check
        run: make fmt-check
      - name: Credo + specs
        run: make lint
      # Lives in the required `lint` job rather than a job of its own: a new job
      # would not be merge-blocking until the human-only merge ruleset is
      # re-applied, and a docs guard nobody has to satisfy guards nothing.
      - name: Every config key has a documentation entry
        working-directory: .
        run: python3 scripts/check-config-docs.py
      # Same rationale as check-config-docs: a drift gate nobody has to
      # satisfy guards nothing, so the env example guard lives in the required
      # lint job and runs on every PR. .env.example is generated from the env
      # schema; a checked-in example that diverges silently omits variables an
      # operator needs at onboarding.
      - name: .env.example matches the env-var schema
        working-directory: .
        run: python3 scripts/check-env-example.py
      # Platform publish/pin drift (#2110): the platform packages the release
      # workflow publishes must equal the packages aiur-cli pins as
      # optionalDependencies, and both must match the shared PUBLISH_TARGETS
      # source. A pin with no published package is a silent broken install —
      # exactly the aiur-cli-darwin-x64 defect — so this lives in the required
      # lint job and runs on every PR.
      - name: Platform publish/pin drift check
        working-directory: .
        run: node packaging/scripts/check-platform-drift.mjs

  coverage-partition:
    name: coverage (${{ matrix.partition }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Test coverage partition
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
          TEST_PARTITIONS: 4
        run: make coverage-partition
      - name: Upload partition coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.partition }}
          path: src/cover/${{ matrix.partition }}.coverdata
          if-no-files-found: error

  coverage:
    needs: coverage-partition
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Report failed coverage partitions
        if: ${{ needs.coverage-partition.result != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: bash scripts/report-ci-failures.sh '^coverage \([1-4]/4\)$' "${{ needs.coverage-partition.result }}"
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Download partition coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: src/cover
          merge-multiple: true
      - name: Verify partition coverage exports
        run: |
          for partition in 1 2 3 4; do
            test -s "cover/${partition}.coverdata"
          done
      - name: Aggregate coverage gate
        run: make coverage-report

  quarantine:
    name: quarantined tests (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Cache _build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/_build
          # No prefix `restore-keys`: a stale _build from a different mix.lock
          # restores compiled deps whose versions no longer match mix.exs, which
          # fails with "Unchecked dependencies for environment test". Exact-key
          # only, so a lock/dep bump recompiles fresh instead of reusing stale
          # artifacts.
          key: ${{ runner.os }}-quarantine-build-${{ hashFiles('src/mix.lock', 'src/mix.exs') }}
      - name: Run quarantined tests
        # `--exclude test` narrows to the tag without failing while the queue
        # is empty; unlike `--only`, that lets this non-blocking job stay green
        # until the first confirmed flake is quarantined.
        run: mix test --include quarantine --exclude test

  test:
    needs: coverage
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Report failed coverage gate
        if: ${{ needs.coverage.result != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: bash scripts/report-ci-failures.sh '^coverage( \([1-4]/4\))?$' "${{ needs.coverage.result }}"
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Install tmux for regression test
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Agent teardown reaping regression (#423)
        run: make regression

  analytics:
    name: analytics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Analytics reducer suite (stdlib unittest)
        env:
          PYTHONPATH: analytics/lib
        run: python3 -m unittest discover -s analytics/tests -t analytics -v

  dialyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Cache PLT
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/_build/dev/*.plt*
          key: ${{ runner.os }}-plt-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-
      - name: Dialyzer
        run: make dialyzer

  browser:
    name: browser harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/browser/package-lock.json
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Cache Playwright browser
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('src/browser/package-lock.json') }}
      - name: Install browser harness dependencies
        working-directory: src/browser
        run: npm ci
      - name: Install Chromium
        working-directory: src/browser
        run: npx playwright install --with-deps chromium
      - name: Run browser, accessibility, and performance smoke
        working-directory: src/browser
        run: npm test
      - name: Verify browser failure evidence, redaction, and teardown
        working-directory: src/browser
        run: npm run verify:failure-artifacts
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-harness-artifacts
          path: src/browser/.artifacts-run-*/
          if-no-files-found: ignore
          include-hidden-files: true

  streamdeck:
    name: streamdeck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/streamdeck
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/streamdeck/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm test
      - name: Build
        run: npm run build

  layout-release:
    name: layout release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/browser/package-lock.json
      - name: Set up mise tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true
      - name: Cache Elixir dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/deps
          key: ${{ runner.os }}-layout-release-mix-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-layout-release-mix-
      - name: Install browser dependencies
        working-directory: src/browser
        run: npm ci
      - name: Install Chromium
        working-directory: src/browser
        run: npx playwright install --with-deps chromium
      - name: Build packaged production release
        id: build
        env:
          MIX_ENV: prod
        run: |
          release_dir=$(bash packaging/scripts/build-release.sh)
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
      - name: Assemble platform package
        id: assemble
        run: |
          out=$(node packaging/scripts/assemble-platform-package.mjs \
            --release "${{ steps.build.outputs.release_dir }}" \
            --target linux-x64 \
            --version 0.0.0-pr.${{ github.run_number }})
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - name: Verify package integrity and offline worker
        run: |
          node packaging/scripts/check-layout-assets-release.mjs --release "${{ steps.build.outputs.release_dir }}"
          node packaging/scripts/check-layout-assets-release.mjs --release "${{ steps.assemble.outputs.out }}/release"
          node src/browser/scripts/check-packaged-layout-worker.mjs --release "${{ steps.assemble.outputs.out }}/release"
