name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
  push:
    branches: [main, v2]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ format('{0}-{1}', github.run_attempt == 1 && (github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.run_attempt == 1 && (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) }}
jobs:
  changes:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: read }
    outputs: {docs_only: "${{ steps.classify.outputs.docs_only }}", full_ci: "${{ steps.classify.outputs.full_ci }}", dialyzer: "${{ steps.classify.outputs.dialyzer }}", affected_paths_b64: "${{ steps.classify.outputs.affected_paths_b64 }}"}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Elixir for selection
        uses: ./.github/actions/setup-elixir
      - name: Classify the changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/classify-ci-changes.sh
  pre-handoff:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0 }
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/pre-handoff
  workflow-security:
    needs: [changes, pre-handoff]
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    name: workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Guard workflow triggers, action pins and PR body rollout
        run: bash scripts/test-workflow-security.sh && python3 scripts/test-rerun-failed-ci-gate.py && python3 scripts/measure-merge-throughput.py --self-test && python3 scripts/test-hot-list-format.py && python3 scripts/test-shared-list-merges.py && node scripts/test-check-browser-smoke-shards.mjs && bash scripts/test-run-pre-handoff-code-checks.sh && python3 scripts/test-run-quarantined-tests.py
      - name: Test legacy Stream Deck nightly cleanup
        run: node scripts/test-cleanup-legacy-streamdeck-nightlies.mjs
      - name: Test human-only merge ruleset verifier
        run: bash scripts/test-human-only-merge-ruleset.sh
      - name: Test human-only merge ruleset drift check
        run: bash scripts/test-human-only-merge-ruleset-live.sh
      - name: Test pull request merge-gate diagnostics
        run: bash scripts/test-pr-merge-gate-diagnostic.sh
      - name: Test CI failure diagnostics
        run: bash scripts/test-report-ci-failures.sh
      - name: Test quarantine _build cache invariants
        run: bash scripts/test-quarantine-build-cache.sh
      - name: Test known-flaky reporter
        run: bash scripts/test-report-known-flaky-tests.sh
      - name: Test coverage flake ledger
        run: python3 scripts/test-record-coverage-flakes.py
      - name: Test CI run-attempt disclosure
        run: bash scripts/test-report-ci-run-attempt.sh
      - name: Test CI change classifier
        run: bash scripts/test-classify-ci-changes.sh && node --test scripts/test-build-home-band-runner.mjs scripts/test-home-parity-signoff.mjs
      - name: Test CI concurrency
        run: node scripts/test-ci-concurrency.mjs && node scripts/test-workflow-check-names.mjs && node scripts/test-ci-events.mjs && python3 scripts/test-run-ci-affected-tests.py && python3 scripts/test-ci-soak.py && python3 scripts/test-check-test-time-bombs.py
      - name: Verify live merge rulesets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-human-only-merge-ruleset-live.sh
      - name: Test rename preflight and plan refresh
        run: make test-rename-preflight && python3 -I scripts/test_plan_refresh.py
      - name: Test config documentation and design extract guards
        run: bash scripts/test-check-config-docs.sh && python3 scripts/test-generate-reference-tables.py && bash scripts/test-check-design-extract.sh
      - name: Check component docs links and test manifest guard
        run: python3 scripts/check-components.py --docs && bash scripts/test-check-components.sh
      - name: Test env example drift guard
        run: bash scripts/test-check-env-example.sh
      - name: Test coverage-shard parity guard
        run: bash scripts/test-check-test-shard-parity.sh
      - name: Test bare assert_receive and on_exit rm_rf guards
        run: bash scripts/test-check-bare-assert-receive.sh && bash scripts/test-check-on-exit-rm-rf.sh && test "${{ needs['pre-handoff'].result }}" = success
      - name: Test hourly retrospective visual check
        run: bash .claude/skills/aiur-run/scripts/tests/executor-retrospective_test.sh
      - name: Test hourly dashboard analyzer
        run: node --test .claude/skills/aiur-meta/scripts/tests/capture-dashboard_test.mjs
      - name: Test hourly retrospective CLI check
        run: bash .claude/skills/aiur-run/scripts/tests/executor-cli-check_test.sh && bash .claude/skills/aiur-run/scripts/tests/check-stack-order_test.sh
      - name: Test file size gate
        run: bash scripts/test-check-file-size.sh
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: src } }
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Elixir
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: ./.github/actions/setup-elixir
      - name: Build release
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make build
  lint:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: src } }
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Elixir
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: ./.github/actions/setup-elixir
      - name: Compile with warnings as errors
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: mix compile --warnings-as-errors && python3 ../scripts/generate-reference-tables.py --check
      - name: Format check
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make fmt-check
      - name: Credo + specs
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make lint
      - name: Config docs and Docker dependency guards
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: python3 scripts/check-config-docs.py && bash website/docs-app/scripts/check-cli-reference.sh && bash website/docs-app/scripts/test-check-cli-reference.sh && python3 scripts/check-docker-path-deps.py && python3 scripts/test-check-docker-path-deps.py
      - name: Cache component checker toolchain
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: scripts/components/node_modules
          key: components-${{ runner.os }}-${{ hashFiles('scripts/components/package-lock.json') }}
      - name: Install component checker toolchain
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: npm ci --prefix scripts/components --ignore-scripts
      - name: Component ownership, reference boundaries, fixtures and Build Order script suites
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: |
          bash scripts/check-components-ci.sh
          bash scripts/test-check-components.sh --with-elixir --with-node
          mise exec -- python3 scripts/test-check-pr-structure.py && bash scripts/test-build-order-scripts.sh
      - name: .env.example matches the env-var schema
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: python3 scripts/check-env-example.py
      - name: Coverage-shard rule agrees across implementations
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: python3 scripts/check-test-shard-parity.py
      - name: Platform publish/pin drift check
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: node packaging/scripts/check-platform-drift.mjs
  coverage-partition:
    name: coverage (${{ matrix.partition }}/4)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full_ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    defaults: { run: { working-directory: src } }
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Elixir
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: ./.github/actions/setup-elixir
      - name: Install zsh for agent scratch regression
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Test coverage partition
        id: partition-tests
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
          TEST_PARTITIONS: 4
          # Put per-test SQLite state in private runner temp, avoiding quota-mounted
          # /tmp; df free space does not reflect EDQUOT limits.
          TMPDIR: ${{ runner.temp }}
        # Stream a file-backed log so orphan processes cannot hold a tee pipe
        # open (#2397), and GitHub captures test output before a runner dies
        # (#2560). Keep the timeout at step level: its ordinary failure lets
        # the log and known-flaky reporting steps below run; a job timeout
        # would cancel them. The private temp avoids quota-mounted /tmp.
        run: |
          log="$RUNNER_TEMP/coverage-partition-${{ matrix.partition }}.log"
          : > "$log"
          tail -n +1 -F "$log" &
          tail_pid=$!
          status=0
          timeout --signal=TERM --kill-after=60s 20m \
            make coverage-partition > "$log" 2>&1 || status=$?
          sleep 2
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::coverage partition ${{ matrix.partition }} exceeded its 20m bound and was terminated; partial log follows in the next step"
          elif [ "$status" -ne 0 ]; then
            echo "::error::coverage partition ${{ matrix.partition }} failed with status $status; full log follows in the next step"
          fi
          exit "$status"
      - name: Report shard composition
        if: ${{ (always()) && needs.changes.outputs.docs_only != 'true' }}
        shell: bash
        working-directory: .
        run: |
          log="$RUNNER_TEMP/coverage-partition-${{ matrix.partition }}.log"
          [ -s "$log" ] || exit 0
          {
            echo "### coverage (${{ matrix.partition }}/4) shard composition"
            echo
            echo '```'
            grep '^coverage-partition:' "$log" || echo "(no shard header; see the partition log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Print partition log
        if: ${{ (failure()) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: cat "$RUNNER_TEMP/coverage-partition-${{ matrix.partition }}.log"
      - name: Report known-flaky test names
        if: ${{ (failure()) && needs.changes.outputs.docs_only != 'true' }}
        shell: bash
        working-directory: .
        run: bash scripts/report-known-flaky-tests.sh "$RUNNER_TEMP/coverage-partition-${{ matrix.partition }}.log" "$GITHUB_STEP_SUMMARY"
      - name: Download previous shard attempts
        continue-on-error: true
        if: ${{ always() && github.run_attempt > 1 && needs.changes.outputs.docs_only != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: shard-flake-evidence-${{ matrix.partition }}-*
          path: ${{ runner.temp }}/previous-shard-attempts
      - name: Record coverage flake ledger
        continue-on-error: true
        if: ${{ always() && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
          PARTITION_OUTCOME: ${{ steps.partition-tests.outcome }}
        run: >-
          python3 scripts/record-coverage-flakes.py
          "$RUNNER_TEMP/coverage-partition-${{ matrix.partition }}.log"
          "$PARTITION_OUTCOME" "$RUNNER_TEMP/previous-shard-attempts"
          "$RUNNER_TEMP/shard-evidence" "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage flake evidence
        continue-on-error: true
        if: ${{ always() && needs.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shard-flake-evidence-${{ matrix.partition }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard-evidence/
          if-no-files-found: error
      - name: Upload partition coverage
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.partition }}
          path: src/cover/${{ matrix.partition }}.coverdata
          if-no-files-found: error
  test:
    needs: [coverage-partition, changes]
    if: ${{ !cancelled() && (needs.changes.outputs.full_ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Report failed coverage partitions
        if: ${{ (needs.coverage-partition.result != 'success') && needs.changes.outputs.docs_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: bash scripts/report-ci-failures.sh '^coverage \([1-4]/4\)$' "${{ needs.coverage-partition.result }}"
      - name: Set up Elixir
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: ./.github/actions/setup-elixir
      - name: Download partition coverage
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: src/cover
          merge-multiple: true
      - name: Verify partition coverage exports
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          for partition in 1 2 3 4; do
            test -s "cover/${partition}.coverdata"
          done
      - name: Aggregate coverage gate
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make coverage-report
      - name: Install tmux for regression test
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Agent teardown reaping regression (#423)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make regression
  quarantine:
    name: quarantined tests (non-blocking)
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/run-quarantine
  home-css:
    name: browser home CSS
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Verify home CSS
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: ./.github/actions/verify-home-css
  analytics:
    needs: changes
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    name: analytics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Analytics reducer suite (stdlib unittest)
        env:
          PYTHONPATH: analytics/lib
        run: python3 -m unittest discover -s analytics/tests -t analytics -v
  dialyzer:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full_ci == 'true' || needs.changes.outputs.dialyzer == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Elixir
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: ./.github/actions/setup-elixir
      - name: Cache PLT
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/_build/dev/*.plt*
          key: ${{ runner.os }}-plt-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-
      - name: Dialyzer
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make dialyzer
  browser:
    name: browser smoke (${{ matrix.shard }}/8)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        include: [{ shard: 1, verify_fixtures: true, upload_evidence: true },
          { shard: 2, visual_regression: first },
          { shard: 5, visual_regression: second },
          { shard: 2, upload_evidence: true }, { shard: 5, upload_evidence: true }, { shard: 8, upload_evidence: true }]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Run browser smoke shard
        uses: ./.github/actions/browser-smoke
        with:
          shard: ${{ matrix.shard }}
          verify_fixtures: ${{ matrix.verify_fixtures || false }}
          upload_evidence: ${{ matrix.upload_evidence || false }}
          visual_regression: ${{ matrix.visual_regression || 'none' }}
  streamdeck:
    name: streamdeck
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full_ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/streamdeck
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Node
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/streamdeck/package-lock.json
      - name: Install dependencies
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npm ci
      - name: Lint
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npm run lint
      - name: Test with coverage
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npm test
      - name: Build
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npm run build
  layout-release:
    name: layout release smoke
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full_ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ (github.run_attempt > 1) && needs.changes.outputs.docs_only != 'true' }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Node
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/browser/package-lock.json
      - name: Set up mise tools
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          # Pin mise itself; bump only in a CI-validated commit.
          version: "2026.8.8"
          install: true
          cache: true
      - name: Set up Bun
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: "1.4.2"
      - name: Test npm launcher
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: packaging/npm/aiur-cli
        run: bun test
      - name: Cache Elixir dependencies
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: src/deps
          key: ${{ runner.os }}-layout-release-mix-${{ hashFiles('src/mix.lock') }}
          restore-keys: ${{ runner.os }}-layout-release-mix-
      - name: Install browser dependencies
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: src/browser
        run: npm ci
      - name: Install Chromium
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: src/browser
        run: npx playwright install --with-deps chromium
      - name: Build packaged production release
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        id: build
        env:
          MIX_ENV: prod
        run: |
          release_dir=$(bash packaging/scripts/build-release.sh)
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
      - name: Assemble platform package
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        id: assemble
        run: |
          out=$(node packaging/scripts/assemble-platform-package.mjs \
            --release "${{ steps.build.outputs.release_dir }}" \
            --target linux-x64 \
            --version 0.0.0-pr.${{ github.run_number }})
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - name: Verify package integrity and offline worker
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          node packaging/scripts/check-layout-assets-release.mjs --release "${{ steps.build.outputs.release_dir }}"
          node packaging/scripts/check-layout-assets-release.mjs --release "${{ steps.assemble.outputs.out }}/release"
          node src/browser/scripts/check-packaged-layout-worker.mjs --release "${{ steps.assemble.outputs.out }}/release"
  affected-tests:
    name: affected tests
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.full_ci == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        working-directory: .
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Set up Elixir
        uses: ./.github/actions/setup-elixir
      - name: Run architectural guards
        run: >-
          mix test --max-cases 4
          test/aiur/base_branch_literal_guard_test.exs
          test/aiur/orchestrator/state_owners_test.exs
          test/aiur/events/placement_rule_test.exs
          test/aiur/orchestrator/non_transition_facade_test.exs
          test/aiur/orchestrator/waiting_descriptor_test.exs
          test/aiur/application_child_order_test.exs
          test/aiur/pr_lifecycle/health_scanner_child_order_test.exs
      - name: Run affected tests on the PR merge
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        env:
          AIUR_CI_CHANGED_PATHS_B64: ${{ needs.changes.outputs.affected_paths_b64 }}
        run: bash ../scripts/run-ci-affected-tests.sh
  # Repeats the PR's added or modified tests with fresh seeds; see .github/workflows/soak.yml.
  soak:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.result == 'success' }}
    uses: ./.github/workflows/soak.yml
  ci-gate:
    name: ci gate
    needs: [changes, workflow-security, pre-handoff, lint, affected-tests, soak, build, coverage-partition, test, dialyzer, browser, home-css, layout-release, analytics, streamdeck]
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Disclose rerun attempt
        if: ${{ github.run_attempt > 1 }}
        run: bash scripts/report-ci-run-attempt.sh "${{ github.run_attempt }}" "$GITHUB_STEP_SUMMARY"
      - name: Require latest PR-body check
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-pr-body-check-run.py
      - name: Require the event's selected jobs
        if: ${{ github.event_name != 'schedule' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-gate.py
