name: Stream Deck package

on:
  pull_request:
    paths:
      - "packages/streamdeck/**"
      - ".github/workflows/streamdeck-package.yml"
  push:
    branches:
      - develop
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/streamdeck
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: packages/streamdeck/package-lock.json
      - name: Package metadata
        id: metadata
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = release ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install, build, and retain production runtime
        run: |
          npm ci
          npm run build
          npm prune --omit=dev
      - name: Assemble self-contained archive
        env:
          COMMIT: ${{ steps.metadata.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.source_date_epoch }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          args=(--output package-dist --commit "$COMMIT" --version "$VERSION" --source-date-epoch "$SOURCE_DATE_EPOCH")
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            args+=(--release-tag "$GITHUB_REF_NAME")
          fi
          node scripts/build-package.mjs "${args[@]}"
      - name: Clean-install smoke test
        run: |
          commit=$(jq -r '.commit' package-dist/*.json)
          release_tag="streamdeck-${commit}"
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          PACKAGE_ARTIFACT_DIR=package-dist PACKAGE_RELEASE_TAG="$release_tag" npm run test:package
      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: streamdeck-${{ steps.metadata.outputs.commit }}
          path: packages/streamdeck/package-dist/*
          if-no-files-found: error

  publish-development-release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: streamdeck-${{ needs.build.outputs.commit }}
          path: package-dist
      - name: Attach immutable commit asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          tag="streamdeck-${COMMIT}"
          manifest_path=$(find package-dist -maxdepth 1 -name '*.json' -print -quit)
          asset=$(jq -r '.artifact' "$manifest_path")
          expected=$(jq -r '.sha256' "$manifest_path")
          manifest=$(basename "$manifest_path")
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" package-dist/* --target "$COMMIT" --prerelease --title "Stream Deck ${COMMIT}" --notes "Immutable Stream Deck sidecar package for ${COMMIT}."
          fi
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for name in "$asset" "$manifest"; do
            if ! grep -Fxq "$name" <<< "$assets"; then gh release upload "$tag" "package-dist/$name"; fi
          done
          verify_dir=$(mktemp -d)
          gh release download "$tag" --pattern "$asset" --dir "$verify_dir"
          gh release download "$tag" --pattern "$manifest" --dir "$verify_dir"
          actual=$(sha256sum "$verify_dir/$asset" | awk '{print $1}')
          test "$actual" = "$expected"
          jq -e --arg commit "$COMMIT" --arg asset "$asset" --arg sha256 "$expected" --arg tag "$tag" '.commit == $commit and .artifact == $asset and .sha256 == $sha256 and .content_address == "releases/download/" + $tag + "/" + $asset' "$verify_dir/$manifest"

  publish-release-asset:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: streamdeck-${{ needs.build.outputs.commit }}
          path: package-dist
      - name: Attach package to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          manifest_path=$(find package-dist -maxdepth 1 -name '*.json' -print -quit)
          asset=$(jq -r '.artifact' "$manifest_path")
          expected=$(jq -r '.sha256' "$manifest_path")
          manifest=$(basename "$manifest_path")
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for name in "$asset" "$manifest"; do
            if ! grep -Fxq "$name" <<< "$assets"; then gh release upload "$TAG" "package-dist/$name"; fi
          done
          verify_dir=$(mktemp -d)
          gh release download "$TAG" --pattern "$asset" --dir "$verify_dir"
          gh release download "$TAG" --pattern "$manifest" --dir "$verify_dir"
          actual=$(sha256sum "$verify_dir/$asset" | awk '{print $1}')
          test "$actual" = "$expected"
          jq -e --arg commit "$COMMIT" --arg asset "$asset" --arg sha256 "$expected" --arg tag "$TAG" '.commit == $commit and .artifact == $asset and .sha256 == $sha256 and .content_address == "releases/download/" + $tag + "/" + $asset' "$verify_dir/$manifest"
