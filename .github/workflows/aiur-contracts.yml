name: aiur-contracts

on:
  push:
    branches: [main]
    paths:
      - 'packages/aiur-contracts/**'
      - '.github/workflows/aiur-contracts.yml'
  pull_request:
    paths:
      - 'packages/aiur-contracts/**'
      - '.github/workflows/aiur-contracts.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aiur-contracts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: packages/aiur-contracts/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
