name: Setup Elixir
description: Install the project toolchain, restore dependencies, and fetch deps.

runs:
  using: composite
  steps:
    - name: Set up mise tools
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        # Pin mise itself; bump only in a CI-validated commit.
        version: "2026.8.8"
        install: true
        cache: true
    - name: Cache deps
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: src/deps
        key: ${{ runner.os }}-mix-${{ hashFiles('src/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Fetch deps
      shell: bash
      working-directory: src
      run: make deps
    - name: Set up Node for pinned layout assets
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: src/browser/package-lock.json
    - name: Generate pinned layout assets
      shell: bash
      run: source scripts/lib/layout-assets.sh && build_layout_assets "$GITHUB_WORKSPACE"
