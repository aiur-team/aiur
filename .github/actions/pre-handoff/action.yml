name: Pre-handoff guards
description: Run selected tests, Dialyzer, and structural handoff guards.

runs:
  using: composite
  steps:
    - name: Set up Elixir and project dependencies
      uses: ./.github/actions/setup-elixir
    - name: Start PostgreSQL for ticket lease integration test
      shell: bash
      run: bash scripts/start-ci-postgres.sh
    - name: Run PostgreSQL ticket-lease integration test
      shell: bash
      working-directory: src
      env:
        AIUR_LEASE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aiur_test
      run: mise exec -- mix test test/aiur/instance_lease_store_test.exs
    - name: Cache Dialyzer PLT
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: src/_build/dev/*.plt*
        key: ${{ runner.os }}-plt-${{ hashFiles('src/mix.lock') }}
        restore-keys: ${{ runner.os }}-plt-
    - name: Test PR evidence and handoff guard
      shell: bash
      run: python3 scripts/test-check-pr-body.py && python3 scripts/test-check-pr-body-closing.py && python3 scripts/test-check-pr-body-compare.py && python3 scripts/test-check-pr-body-check-run.py && python3 scripts/test-check-agent-scratch.py && bash scripts/test-pre-handoff-guards.sh
    - name: Run pre-handoff guards
      shell: bash
      env:
        AIUR_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        AIUR_MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        AIUR_PUSH_BEFORE: ${{ github.event.before }}
      run: scripts/run-pre-handoff-guards.sh
