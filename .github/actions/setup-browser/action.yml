name: Setup browser harness
description: Install the browser harness and its fixture toolchain.
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: src/browser/package-lock.json
    - name: Install fixture build tools
      shell: bash
      run: apt-get update && apt-get install -y --no-install-recommends build-essential
    - name: Set up Elixir
      uses: ./.github/actions/setup-elixir
    - name: Cache Playwright browser
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('src/browser/package-lock.json') }}
    - name: Install browser harness dependencies
      working-directory: src/browser
      shell: bash
      run: npm ci
    - name: Install Chromium
      working-directory: src/browser
      shell: bash
      run: npx playwright install --with-deps chromium
