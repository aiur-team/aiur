name: Stream Deck checks
description: Run the stream deck checks steps after checkout.
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: packages/streamdeck/package-lock.json
    - name: Install dependencies
      shell: bash
      working-directory: packages/streamdeck
      run: npm ci
    - name: Lint
      shell: bash
      working-directory: packages/streamdeck
      run: npm run lint
    - name: Test with coverage
      shell: bash
      working-directory: packages/streamdeck
      run: npm test
    - name: Build
      shell: bash
      working-directory: packages/streamdeck
      run: npm run build
