name: Layout release smoke
description: Run the layout release smoke steps after checkout.
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: src/browser/package-lock.json
    - name: Set up mise tools
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        # Pin mise itself; bump only in a CI-validated commit.
        version: "2026.8.8"
        install: true
        cache: true
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
      with: { bun-version: "1.4.2" }
    - name: Test npm launcher
      shell: bash
      working-directory: packaging/npm/aiur-cli
      run: bun test
    - name: Cache Elixir dependencies
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: src/deps
        key: ${{ runner.os }}-layout-release-mix-${{ hashFiles('src/mix.lock') }}
        restore-keys: ${{ runner.os }}-layout-release-mix-
    - name: Install browser dependencies
      shell: bash
      working-directory: src/browser
      run: npm ci
    - name: Install Chromium
      shell: bash
      working-directory: src/browser
      run: npx playwright install --with-deps chromium
    - name: Build packaged production release
      shell: bash
      id: build
      env: { MIX_ENV: prod }
      run: |
        release_dir=$(bash packaging/scripts/build-release.sh)
        echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
    - name: Assemble platform package
      shell: bash
      id: assemble
      run: |
        out=$(node packaging/scripts/assemble-platform-package.mjs \
          --release "${{ steps.build.outputs.release_dir }}" \
          --target linux-x64 \
          --version 0.0.0-pr.${{ github.run_number }})
        echo "out=$out" >> "$GITHUB_OUTPUT"
    - name: Verify package integrity and offline worker
      shell: bash
      run: |
        node packaging/scripts/check-layout-assets-release.mjs --release "${{ steps.build.outputs.release_dir }}"
        node packaging/scripts/check-layout-assets-release.mjs --release "${{ steps.assemble.outputs.out }}/release"
        node src/browser/scripts/check-packaged-layout-worker.mjs --release "${{ steps.assemble.outputs.out }}/release"
