[tools]
erlang = "28"
elixir = "1.19.5-otp-28"
opencode = "1.17.10"           # pinned: aiur's opencode pane integration is validated against 1.17.10 (custom-provider model resolution + chat panes verified end-to-end). Keep on a specific version, never `latest` — a bump requires re-running the row-shape + pane verification (see src/docs/notes/opencode-row-shapes-1.17.10.md).
ripgrep = "latest"

[tasks.setup]
description = "Bootstrap the dev environment: install the toolchain and symlink aiurdev onto your PATH"
run = "$MISE_PROJECT_ROOT/scripts/setup"
