tracker:
  kind: linear
  # github:
    # Whole intake list; omit for .github/ALLOWED-CONTRIBUTORS fallback.
    # Explicit {} or null admits nobody. Ids are numeric; logins are API addresses only.
    # allowed_contributors:
    #   users: [583231]
    #   orgs: [{id: 9919, login: github}]
  base_branch: your-base-branch
  active_states:
    - Todo
    - In Progress
  terminal_states:
    - Closed
    - Cancelled
    - Canceled
    - Duplicate
    - Done
linear:
  api_key: $LINEAR_API_KEY
  project_slug: your-project-slug
# Merge policy defaults; currently validated and shown in status/capabilities.
# Merge enforcement, worker instructions and main watching ship separately.
# merge_policy:
#   ci: wait                       # wait | pending_ok; pending_ok needs main_watch.enabled
#   local_tests: partial           # all | partial | none; pending_ok forbids none
#   full_ci_labels: [main-fix]
#   full_ci_paths: []               # changed-path globs forcing full CI
#   premerge_checks: []             # commands on the merge result
#   attribution_scan: false
#   main_watch:
#     enabled: false
#     workflows: []                 # empty = all base-branch workflows
#     on_red: alert                 # alert | dispatch_fixer
#     fixer_label: main-fix         # dispatch_fixer requires this in full_ci_labels
#     canary_minutes: 45            # 0 disables canary reruns

observability:
  # Opt in only when this run owns the Tailscale Funnel HTTPS 443 target.
  # build_order_funnel_health_check: true
  # Set to false to disable run telemetry recording (Analytics page will be empty).
  # telemetry_enabled: true
  # Retain useful cross-session telemetry without splitting an individual boot.
  telemetry_retention_max_bytes: 67108864
  telemetry_retention_max_age_days: 30
executor_takeover_first_alert_hours: 8
executor_takeover_continuous_alert_hours: 1
server:
  tailscale_funnel: false
polling:
  idle_widen_factor: 5.0
  # Per-class cadences override interval_seconds for one class (#2309). The
  # `ci` class is deliberately not listed — it only ever slows CI detection, so
  # keep it at the fallback. `review` widens only while a webhook proves
  # comment coverage; `planning` is on-demand (0 = no timer). `firehose` is also
  # not listed: its loop rides the dispatch tick and is self-regulating via
  # X-Poll-Interval, so an entry would be a dead knob.
  intervals:
    dispatch: 120
    review: 300
    planning: 0        # on-demand: no timer
workspace:
  root: ~/code/aiur-workspaces
hooks:
  after_create: |
    # Aiur runs this in an empty atomic staging directory.
    git clone "$THIS_REPOSITORY_URL" .
  before_remove: |
    git status --short
agent:
  priority: [codex]
  # accounts: {claude: [default, work]}   # applies when a ticket routes to Claude
  # account_selection: balance
  max_concurrent_agents: 10
  max_turns: 20
  # max_turns_by_complexity: {1: 6, 2: 12, 3: 20}
  codex:
    command: codex app-server
    # This is an explicit headless-workflow choice. Unconfigured workflows
    # retain the secure `untrusted` default.
    approval_policy: never
    thread_sandbox: workspace-write
prompt_file: linear-codex.prompt.md

# Build queue is unsupported on Linear; no queue label writes.
# build_queue:
#   start_trigger: pr_merged           # issue_closed, pr_merged, pr_approved, pr_ci_green, pr_opened
#   enabled: true
#   reconcile_interval_seconds: 60      # 10..3600 seconds
#   max_writes_per_minute: 20           # 1..60 writes
#   observation_max_age_seconds: null  # 2 x polling.interval_seconds; explicit 10..3600
#   merged_open_grace_seconds: 600      # 60..86400 seconds
